<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ef">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KAOWIN">
<title>KAOWIN</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7ef; --card:#ffffff; --soft:#dcefdf; --soft2:#f5fbf5;
  --pri:#1f7a52; --pri-d:#0d5a3c; --ink:#17261c; --mut:#66796b; --line:#dfeae1;
  --warn:#a86f0e; --warn-bg:#fdf3dd; --bad:#b9443a; --bad-bg:#fbe7e4; --ok-bg:#e1f3e5; --gold:#e8b931;
  --c-easy:#1f7a52; --c-long:#2f8a86; --c-quality:#d4822a; --c-race:#c9497a; --c-gym:#7a62b8; --c-rest:#9aa79d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box;padding-bottom:0!important}
main{flex:1 0 auto;width:100%;box-sizing:border-box}
.top,.foot{width:100%}
.foot{background:#0d5a3c;color:#e3f4e8;margin-top:8px}
.foot-in{max-width:640px;margin:0 auto;padding:16px 16px calc(78px + env(safe-area-inset-bottom));text-align:left;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;align-items:flex-start}
.foot-in b{color:#fff;font-weight:600;letter-spacing:.2px}
.foot-in span{color:#b9dec6}
.line-btn{display:inline-flex;align-items:center;gap:8px;background:#06c755;color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:11px 18px;margin-bottom:4px;min-height:44px;box-sizing:border-box}
.line-btn:hover{background:#05b04b;color:#fff}
.foot-in .line-id{font-size:12px;margin-bottom:12px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(238,247,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;flex:none;display:block}
.wordmark{font-family:"Outfit",sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1;color:var(--pri-d)}
.who{background:none;border:0;padding:0;cursor:pointer;text-align:right;font-size:13px;color:var(--pri-d);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;display:block}
.tagline{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px;white-space:nowrap;letter-spacing:.2px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.slogan{margin:10px auto 0;text-align:center}
.slogan .th{display:block;font-size:30px;font-weight:700;line-height:1.15;color:var(--pri-d);letter-spacing:.5px}
.slogan .en{display:inline-block;font-family:"Outfit",sans-serif;font-weight:800;font-style:italic;font-size:22px;letter-spacing:.3px;line-height:1.3;
  background:linear-gradient(90deg,#0d5a3c 0%,#1f9a5c 45%,#8fd93a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px}
.slogan .bar{display:block;width:56px;height:4px;border-radius:4px;margin:8px auto;background:linear-gradient(90deg,#1f9a5c,#b6ef5a)}
.slogan .desc{display:inline-block;font-size:14px;font-weight:600;color:#0d3d28;background:linear-gradient(90deg,#d6f2dd,#ecf9d4);border:1px solid #c8e8cf;border-radius:16px;padding:8px 18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(150deg,#d3eed9 0%,#f4fbf5 70%);border-color:#cfe7d4}
.big{font-size:42px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.box{background:var(--soft2);border-radius:12px;padding:10px;text-align:center}
.box b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--pri-d);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.pink{background:#f9e1ea;color:#9c2f5a} .chip.gray{background:#eef1ee;color:var(--mut)} .chip.gold{background:#fbf0cc;color:#8a6a06} .chip.brown{background:#f3ead9;color:#7a5a24} .chip.ag{background:#e8f1fb;color:#2b5d8a}
.agbox{background:#eef5fc;border:1px solid #d3e3f3;border-radius:12px;padding:8px 12px;font-size:13px;margin-top:6px;line-height:1.5}.agbox b{color:#1f4f7a}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;background:var(--ok-bg);color:#1f5a33}
.note.warn{background:var(--warn-bg);color:#6e4a08} .note.bad{background:var(--bad-bg);color:#7a2a22} .note.info{background:#eef3fb;color:#2a4a7a} .note.gold{background:#fbf0cc;color:#6b5205}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.warn i{background:#e0a33a} .bar.bad i{background:var(--bad)}
.empty{text-align:center;padding:28px 16px}
.empty p{margin:6px 0 14px;color:var(--mut)}
/* sessions */
.sess{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sess:first-child{border-top:0}
.sess.next{background:var(--soft2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.day{text-align:center;line-height:1.15}
.day b{display:block;font-size:15px} .day span{font-size:11px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;color:#fff;margin-right:6px;vertical-align:1px}
.t-easy{background:var(--c-easy)} .t-long{background:var(--c-long)} .t-quality{background:var(--c-quality)} .t-race{background:var(--c-race)} .t-gym{background:var(--c-gym)} .t-rest{background:var(--c-rest)}
.gym-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.gym-sum div{background:var(--soft2);border-radius:14px;padding:10px;text-align:center}.gym-sum b{display:block;font-size:22px;color:var(--ink)}.gym-sum span{font-size:12px;color:var(--mut)}
.gym-step{background:#fff8ea;border:1px solid #f0dcae;border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.ex{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.ex-fig{flex:none;align-self:flex-start;width:112px;height:128px;background:linear-gradient(180deg,#f3faf5,#e4f2e9);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:4px}
.ex-fig svg{width:104px;height:auto}
.ex-body{min-width:0;flex:1}.ex-name{font-weight:700;font-size:16px;line-height:1.3}.ex-name span{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.ex-dose{margin:6px 0;font-size:14px;color:var(--c-gym)}.ex-dose b{color:var(--c-gym)}
.ex ul{margin:0 0 8px 16px;padding:0;font-size:12.5px;color:var(--mut);line-height:1.5}
.ex-sets{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.setdot{width:34px;height:34px;border-radius:50%;border:2px solid var(--c-gym);background:#fff;color:var(--c-gym);font-weight:700;font-size:14px;cursor:pointer}
.setdot.on{background:var(--c-gym);color:#fff}
.sdesc{font-weight:500} .smeta{font-size:12.5px;color:var(--mut)}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-size:14px}
.st.done{background:var(--pri);border-color:var(--pri);color:#fff}
.st.missed{border-color:#e7b9b3;color:var(--bad);background:var(--bad-bg)}
.st.today{border-color:var(--pri);color:var(--pri)}
.st.rest{border:0;background:none}
.adj{font-size:11px;font-weight:600;color:var(--warn);margin-left:4px}
/* plan */
details.week{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.week>summary::-webkit-details-marker{display:none}
details.week[open]>summary{border-bottom:1px solid var(--line);background:var(--soft2)}
.chev{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--soft2);color:var(--pri-d);text-align:center;line-height:22px;font-size:12px;transition:transform .2s;margin-left:6px;vertical-align:middle}
details.week[open] .chev{transform:rotate(180deg)}
.wprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wprev span{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--soft2);color:var(--mut);white-space:nowrap}
.wprev span b{color:var(--ink);font-weight:600}
details.week[open] .wprev{display:none}
.wbody{padding:4px 14px 12px}
.wk{font-weight:700}
.group{margin:22px 0 10px;padding:12px 14px;border-radius:14px;background:#f9e9ef;color:#7a2448;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* lists */
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.del{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:4px}
.linkbtn{background:none;border:0;color:var(--pri-d);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0}
/* charts */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:12px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bplan{position:absolute;bottom:0;left:0;right:0;border:1.5px dashed #b9d8c0;border-bottom:0;border-radius:6px 6px 0 0}
.bact{position:relative;width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.bcol.cur .bact{background:#9ad94a}
.blabels{display:flex;gap:5px;margin-top:4px}
.blabels span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.vo2{display:flex;align-items:flex-end;gap:14px}
.vo2 .big{font-size:48px;color:var(--pri-d)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft2);color:var(--mut);flex:none}
.rank.r1{background:#fbe7a6;color:#7a5a00} .rank.r2{background:#e6eaee;color:#4a5560} .rank.r3{background:#f3d9c4;color:#7a4316}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:var(--soft);color:var(--pri-d)} .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)} .btn.danger{background:#fff;border:1px solid #efc9c4;color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:grid;gap:10px;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;border-radius:999px;padding:13px 18px;box-shadow:0 8px 20px rgba(42,114,67,.28)}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{color:var(--pri-d);font-weight:700}
.tabs svg{width:22px;height:22px}
/* sheet + forms */
.tipscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:2px 0 6px}.tipscroll::-webkit-scrollbar{display:none}
.tipbar{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;font:inherit;font-size:13px;line-height:1.35;text-align:left;cursor:pointer;border:1px solid}
.tipbar .ic{font-size:20px;flex:none}.tipbar .tx{flex:1;min-width:0}.tipbar .tx b{display:block;font-size:13.5px}.tipbar .go{flex:none;font-weight:700;opacity:.7}
.tipbar.red{background:#fdecea;border-color:#f3c3bd;color:#8e2a20}.tipbar.amber{background:#fff6e0;border-color:#f0dcae;color:#7a5306}.tipbar.green{background:#e9f6ee;border-color:#c5e6d2;color:#0d5a3c}
.tipdots{display:flex;gap:4px;justify-content:center;margin:0 0 12px}.tipdots i{width:5px;height:5px;border-radius:3px;background:#c9dcd0;transition:width .2s}.tipdots i.on{background:#0d5a3c;width:14px}
.kb .sev{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}.kb .sev.red{background:#fdecea;color:#b3261e}.kb .sev.amber{background:#fff6e0;color:#8a5a00}.kb .sev.green{background:#e9f6ee;color:#0d5a3c}
.kb h4{margin:14px 0 6px;font-size:14px}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.foodgrid div{border-radius:12px;padding:10px;font-size:12.5px;line-height:1.55;background:#f5fbf5;border:1px solid var(--line)}.foodgrid div:last-child{background:#fff8ea;border-color:#f0dcae}.foodgrid b{display:block;font-size:13.5px;margin-bottom:4px}.kb ul,.kb ol{margin:0 0 6px 18px;padding:0;font-size:13.5px;line-height:1.6}
.callbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:#e2453c;color:#fff!important;text-decoration:none;border-radius:14px;padding:12px;font-weight:800;font-size:16px;margin:12px 0 4px}
.kbgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.kbgrid button{border:1px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:12.5px;text-align:left;background:#fff;cursor:pointer;color:var(--ink)}.kbgrid button.red{border-left:4px solid #e2453c}.kbgrid button.amber{border-left:4px solid #e0a83a}.kbgrid button.green{border-left:4px solid #3aa06a}
.cx-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 16px 14px;color:#fff;cursor:pointer;background:radial-gradient(120% 140% at 100% 0%,#1f8a5b 0%,#0d5a3c 45%,#073826 100%);box-shadow:0 18px 40px rgba(7,56,38,.3);margin-bottom:14px}
.cx-hero:after{content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,245,96,.22),transparent 65%);pointer-events:none}
.cx-lbl{font-size:11.5px;letter-spacing:.06em;opacity:.8;font-weight:700}
.cx-row{display:flex;gap:14px;align-items:center;margin-top:10px;position:relative;z-index:1}
.cx-ring{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#c8f560 calc(var(--p)*1%),rgba(255,255,255,.14) 0);position:relative}
.cx-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0b4d34}.cx-ring b{position:relative;font-family:Outfit,sans-serif;font-size:26px;line-height:1}.cx-ring span{position:absolute;bottom:20px;font-size:10px;opacity:.7}
.cx-info{flex:1;min-width:0}.cx-info .t{font-weight:800;font-size:16.5px;line-height:1.25}.cx-info .s{font-size:12.5px;opacity:.82;margin-top:3px}
.cx-pill{display:inline-flex;align-items:baseline;gap:4px;margin-top:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:12.5px}.cx-pill b{font-family:Outfit,sans-serif;font-size:20px;color:#c8f560}
.cx-up{color:#c8f560;font-weight:700;font-size:12px;margin-left:6px}
.cx-mini{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.08);position:relative;z-index:1;font-size:12.5px}.cx-mini b{color:#c8f560}
.cx-bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.cx-bar i{display:block;height:100%;background:#c8f560;border-radius:4px}
.cx-foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;position:relative;z-index:1}
.cx-promo{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 14px;padding:12px 14px;border:0;border-radius:18px;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(120deg,#0d5a3c,#1f8a5b);box-shadow:0 10px 24px rgba(7,56,38,.25)}
.cx-sech{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}.cx-sech h2{margin:0}.cx-sech span{font-size:12px;color:var(--mut)}
.cx-lob{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx-lc{position:relative;overflow:hidden;border-radius:20px;padding:14px 12px 12px;color:#fff;min-height:150px;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(0,0,0,.12);cursor:pointer}
.cx-em{font-size:30px}.cx-n{font-weight:800;font-size:15px;line-height:1.25;margin-top:6px}.cx-m{font-size:11.5px;opacity:.85;margin-top:2px}
.cx-ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.cx-av{display:flex}.cx-av i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.9);margin-left:-6px;display:grid;place-items:center;font-style:normal;font-size:9px;color:#333;font-weight:700}.cx-av i:first-child{margin-left:0}
.cx-jbtn{background:#fff;color:#0d5a3c;font:inherit;font-weight:800;font-size:12.5px;border-radius:999px;padding:6px 12px;border:0;cursor:pointer}.cx-jbtn.on{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
.cx-g1{background:linear-gradient(150deg,#1f8a5b,#0b4d34)}.cx-g2{background:linear-gradient(150deg,#3b7dd8,#1d3f8a)}.cx-g3{background:linear-gradient(150deg,#f08a3c,#c2410c)}.cx-g4{background:linear-gradient(150deg,#8a6a3a,#4a3418)}

function figSVG(key, size = 120) {
  const [A, B] = POSE[key], dur = key === "plank" || key === "balance" ? "3.2s" : "2.6s";
  const an = (attr, a, b) => `<animate attributeName="${attr}" values="${a};${b};${b};${a};${a}" keyTimes="0;.4;.5;.9;1" dur="${dur}" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;0 0 1 1;.45 0 .55 1;0 0 1 1"/>`;
  const line = ([p, q, far]) => `<line x1="${A[p][0]}" y1="${A[p][1]}" x2="${A[q][0]}" y2="${A[q][1]}" stroke="${far ? "#8fc4a6" : "#0d5a3c"}" stroke-width="${p === "n" && q === "hp" ? 9 : 6.5}" stroke-linecap="round">${an("x1", A[p][0], B[p][0])}${an("y1", A[p][1], B[p][1])}${an("x2", A[q][0], B[q][0])}${an("y2", A[q][1], B[q][1])}</line>`;
  const db = PROP[key] === "db" ? ["wR", "wL"].map((w, i) => `<rect x="${A[w][0] - 6}" y="${A[w][1] - 3}" width="12" height="6" rx="2" fill="${i ? "#3d3d3d" : "#777"}">${an("x", A[w][0] - 6, B[w][0] - 6)}${an("y", A[w][1] - 3, B[w][1] - 3)}</rect>`).join("") : "";

}

const GYM_PLAN = { A: ["split", "stepup", "calf", "balance"], B: ["goblet", "rdl", "bridge", "plank"], light: ["swing", "bridgeL", "calfL", "hipflex"] };
const gymKeyOf = d => d === GYM.A || /^เวทขา A/.test(d) ? "A" : d === GYM.B || /^เวทขา B/.test(d) ? "B" : d === GYM.light || /^เวทเบา/.test(d) ? "light" : "";
function gymHtml(s, detail) {
  const k = gymKeyOf(detail); if (!k) return "";
  const p = P(), lvl = { beginner: -1, intermediate: 0, advanced: 1 }[p.level] ?? 0, done = (p.gymDone || {})[s.key] || {};
  const list = GYM_PLAN[k].map(id => { const e = EX[id]; return { id, e, sets: Math.max(2, e[3] + (e[8] ? lvl : 0)) }; });
  const mins = Math.round((list.reduce((t, x) => t + x.sets * (x.e[5] + x.e[6]), 0)) / 60) + (k === "light" ? 3 : 10);
  return `<div class="gym-sum"><div><b>${mins}</b><span>นาที (รวมวอร์ม)</span></div><div><b>${list.length}</b><span>ท่า</span></div><div><b>${list.reduce((t, x) => t + x.sets, 0)}</b><span>เซตรวม</span></div></div>
    <div class="gym-step">🔥 <b>วอร์มอัพ ${k === "light" ? 2 : 5} นาที</b> — เดินเร็ว/วิ่งเหยาะอยู่กับที่ + แกว่งขา หมุนสะโพก</div>
    ${list.map((x, i) => { const e = x.e, n = Math.min(done[i] || 0, x.sets); return `<div class="ex">
      <div class="ex-fig">${figSVG(e[0])}</div>
      <div class="ex-body"><div class="ex-name">${i + 1}. ${e[2]}<span>${e[1]}</span></div>
        <div class="ex-dose"><b>${x.sets} เซต</b> × ${e[4]} · พัก ${e[6] >= 60 ? (e[6] / 60) + " นาที" : e[6] + " วิ"}</div>
        <ul>${e[7].map(c => `<li>${c}</li>`).join("")}</ul>
        <div class="ex-sets">${Array.from({ length: x.sets }, (_, j) => `<button type="button" class="setdot ${j < n ? "on" : ""}" data-act="gymSet" data-key="${s.key}" data-i="${i}" data-j="${j}">${j < n ? "✓" : j + 1}</button>`).join("")}<span class="tiny mut">แตะเมื่อเล่นจบแต่ละเซต</span></div>
      </div></div>`; }).join("")}
    <div class="gym-step">🧘 <b>คูลดาวน์ ${k === "light" ? 3 : 5} นาที</b> — ยืดน่อง ต้นขาหน้า-หลัง สะโพก ค้างท่าละ 30 วินาที</div>
    <p class="tiny mut" style="margin:8px 2px 12px">${lvl < 0 ? "ระดับเริ่มต้น: ลดเซตแล้ว เน้นท่าถูกก่อนเพิ่มน้ำหนัก" : "น้ำหนัก: เลือกให้ 2 ครั้งสุดท้ายของเซตเริ่มหนัก แต่ท่ายังถูก"} · ถ้าเจ็บแปลบ ๆ ให้หยุดท่านั้น · วันก่อน Quality/Long ให้เบาลง</p>`;
}

function achievementsFor(p, l) {

  }

    const maxT = Math.max(0, ...prev.map(x => toSec(x.time) || 0));

    if (km >= 5 && sec && !steepLog(l) && !isTM(l) && f5.length >= 3 && sec / km < Math.min(...f5) - 1) add("fast-" + l.id, "rec", "เร็วสุด", "เพซเร็วที่สุดของการวิ่ง 5 กม.ขึ้นไป!", `${fmtPace(sec / km)}/กม. (เดิม ${fmtPace(Math.min(...f5))})`);

const TIP_ROT = ["heat", "heart", "fuel", "hypona", "injury", "carb", "easy", "heart", "cramp", "bonk", "heat", "rhabdo", "sick", "hot", "heatex", "carb"];   // raceday/recovery ขึ้นเฉพาะช่วงแข่ง
const dayNo = d => Math.floor(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5);
function tipsFor(p) {
  const out = [], push = id => { if (TIPS[id] && !out.includes(id)) out.push(id); }, dn = dayNo(TODAY), odd = dn % 2;
  const seed = [...String(p.id || p.name || "")].reduce((t, c) => t + c.charCodeAt(0), 0);
  // ---- เหตุพิเศษของคนนี้ ----
  if (PAIN) push("injury");
  const up = sortedRaces(p).find(r => r.date >= TODAY && diffDays(TODAY, r.date) <= 3);
  if (up) { push("raceday"); if (LONGCATS.includes(rcat(up))) push("carb"); }
  const past = sortedRaces(p).filter(r => r.date < TODAY && diffDays(r.date, TODAY) <= 3).pop() || runLogs(p).find(l => l.type === "race" && l.date < TODAY && diffDays(l.date, TODAY) <= 3);
  if (past) push("recovery");
  const longSoon = allSessions().find(s => (s.date === TODAY || s.date === addDays(TODAY, 1)) && view(s).type === "long");
  const mr = mainRace(p);
  if (longSoon) { if (mr && isTrail(mr) && odd) push("trail"); else if ((view(longSoon).km || 0) >= 18 && odd) push("hypona"); else push("fuel"); }
  const ref = hrRef(p), recent = runLogs(p).filter(l => l.date >= addDays(TODAY, -3));
  if (recent.some(l => (l.type === "easy" || l.type === "long") && l.hrAvg && ref && l.hrAvg / ref >= 0.88)) push("heatex");
  if (recent.some(l => (l.walkSec && toSec(l.time) && l.walkSec / toSec(l.time) > 0.1) || /ตะคริว/.test(l.note || ""))) push("cramp");
  const mo = +TODAY.slice(5, 7); if (mo >= 3 && mo <= 5) push(odd ? "heat" : "hot");
  if (p.level === "beginner" && p.startedOn && diffDays(p.startedOn, TODAY) <= 21) push(odd ? "heart" : "easy");
  if (mr && isTrail(mr) && dn % 5 === 0) push("trail");
  // ---- ไม่มีเหตุพิเศษ: วนวันละเรื่อง (แต่ละคนเริ่มคนละจุด) ----
  for (let k = 0; out.length < 5 && k < TIP_ROT.length; k++) push(TIP_ROT[(dn + seed + k) % TIP_ROT.length]);
  return out;
}

}

    if (v1 === v0) return ""; const add = d.k === "longest" ? `ไกลสุดใหม่ ${fmtKm(v1)} กม.` : `+${fmtRoom(room, v1 - v0)} ${d.unit}`;

}
function chMonthEnd(p) {
  const done = p.chDone = p.chDone || {}, out = [];
  joinedRooms(p).filter(r => r.slice(0, 7) < curMonth() && !done[r]).forEach(room => {
    const d = roomDef(room), v = roomVal(p, room), c = (p.chCache || {})[room] || {}; done[room] = 1;
    if (d.target ? v >= d.target : c.rank && c.rank <= 3) {
      const k = "ch-" + room; p.badges = p.badges || [];
      if (!p.badges.some(b => b.k === k)) { const a = { k, kind: "plan", medal: d.target ? "✓" : "#" + c.rank, title: `Finisher ชาเลนจ์ ${d.name} · ${monthTH(room)}`, sub: d.target ? `ทำได้ ${fmtRoom(room, v)} ${d.unit} จากเป้า ${fmtRoom(room, d.target)}` : `จบอันดับ ${c.rank} ของห้อง` };
        p.badges.push({ ...a, d: TODAY }); out.push(a); }
    }
  });
  if (Object.keys(done).length) save();
  return out;
}

    <div class="bar"><i style="width:${weekKm ? Math.min(100, weekGot / weekKm * 100) : 0}%"></i></div>
    ${noteHtml(A[wi])}
    <div style="margin-top:8px">${w.sessions.map(s => sessRow(s, next && s.key === next.key)).join("")}</div>
  </div>` : ""}
  ${others.length ? `<div class="card"><h3>รายการแข่งอื่น ๆ</h3>${others.map(r => `<div class="item" data-act="raceForm" data-id="${r.id}"><span class="chip pink">${esc(raceShort(r))}</span><div class="grow"><b>${PRIO[prioOf(p, r)].icon} ${esc(r.name)}</b> <span class="tiny mut">${PRIO[prioOf(p, r)].label}</span><div class="tiny mut">${thDateY(r.date)} · เป้า ${fmtTime(r.target)} · ${esc(targetSub(r))}${agChip(p, r) ? " · 🏅 " + esc(agChip(p, r)) : ""}</div></div></div>`).join("")}</div>` : ""}`;
}

function renderPlan() {

  const cw = curWeek(); let lastRace = null, html = `<div class="row" style="align-items:flex-start"><div class="tiny mut">แตะการ์ดสัปดาห์เพื่อดูนัดซ้อมทั้งหมด · แตะนัดเพื่อส่งผลหรือแก้ไข</div><button class="btn ghost sm" data-act="toggleWeeks" style="flex:none">${planAllOpen ? "ย่อทั้งหมด" : "เปิดทั้งหมด"}</button></div>`;
  W.forEach(w => {

    const runs = w.sessions.filter(s => RUN_TYPES.includes(s.type));

      <div class="small mut" style="text-align:right;white-space:nowrap">${fmtKm(km)} กม.<span class="chev">▾</span>${w.vert ? `<br>⛰️ ${fmtVert(w.vert)} ม.` : ""}<br>${w.end < TODAY || done ? done + "/" + runs.length : ""}</div></summary>

      ${PACE_KEYS.filter(([k]) => !(tr && k === "race")).map(([k, l]) => `<tr><td>${k === "race" ? "<b>" + l + "</b>" : l}</td><td class="num">${k === "race" ? "<b>" + rng(pc.ranges[k]) + "</b>" : rng(pc.ranges[k])}</td></tr>`).join("")}
      </table><div class="tiny mut" style="margin-top:8px">${tr ? "เทรล: ใช้เพซนี้เฉพาะวันวิ่งทางเรียบ บนเนิน/เทรลให้คุมด้วยความเหนื่อย (Easy ≈ 4–5/10, คุยได้) และเดินขึ้นชันได้เสมอ · วันแข่งเฉลี่ย " + fmtPace(nr.target / nr.km) + "/กม." : "คำนวณจากเป้าหมาย ช่วงร้อนชื้นให้ Easy และ Long ช้ากว่านี้ได้"}</div></div>`;

}

function renderStats() {
  const p = P(), runs = runLogs(p), fit = fitness(p);
  let vo2 = `<div class="mut small">ยังไม่มีค่า — ใส่ค่าจากนาฬิกา (Garmin, COROS ฯลฯ) หรือใส่ PB / ส่งผลซ้อมที่มีช่วงเร็ว ≥ 2 กม. เพื่อให้แอปคำนวณ</div>`;
  if (fit) {
    const mlog = [...(p.vo2log || [])].sort((a, b) => a.date.localeCompare(b.date));
    const pts = mlog.length >= 2 ? mlog.map(m => ({ v: +m.value, date: m.date })) : fit.efforts.filter(e => e.date).sort((a, b) => a.date.localeCompare(b.date));
    let spark = "";
    if (pts.length >= 2) {
      const vs = pts.map(e => e.v), mn = Math.min(...vs) - 1, mx = Math.max(...vs) + 1;
      const xy = pts.map((e, i) => [i / (pts.length - 1) * 280 + 10, 60 - (e.v - mn) / (mx - mn) * 50]);
      spark = `<svg viewBox="0 0 300 70" style="width:100%;height:70px;margin-top:8px"><polyline fill="none" stroke="#3d9a5b" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(a => a.join(",")).join(" ")}"/>${xy.map(a => `<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#fff" stroke="#3d9a5b" stroke-width="2"/>`).join("")}</svg><div class="tiny mut">${mlog.length >= 2 ? "แนวโน้มจากค่าที่ใส่เอง" : "แนวโน้มจากผลที่มีวันที่"}</div>`;
    }
    const gap = fit.longest && fit.longest.km >= 15 ? fit.v - fit.longest.v : 0;
    vo2 = `<div class="vo2"><div class="big">${fit.v.toFixed(1)}</div><div style="padding-bottom:6px"><span class="chip">${vdotBand(fit.v)}</span><div class="tiny mut" style="margin-top:4px">มล./กก./นาที · ${fit.manual ? esc(fit.best.label) : "ประมาณจาก " + esc(fit.best.label)}</div></div></div>
      ${fit.manual && fit.calcV ? `<div class="tiny mut">คำนวณจากผลวิ่งได้ ${fit.calcV.toFixed(1)}${Math.abs(fit.calcV - fit.v) >= 4 ? " — ต่างจากนาฬิกาค่อนข้างมาก ตารางเพซใช้เป้าแข่งเป็นหลักอยู่แล้ว" : ""}</div>` : ""}
      ${spark}
      ${gap > 3 ? `<div class="note warn">ความเร็วนำความทนทาน: ${esc(fit.longest.label)} เทียบได้ VO2max แค่ ${fit.longest.v.toFixed(1)} ต่ำกว่าค่าดีสุด ${gap.toFixed(1)} — เน้น Long Run, ซ้อมเติมพลังงาน และเพซแข่งช่วงท้าย</div>` : ""}
      <table style="margin-top:10px"><tr><th>เวลาที่ทำได้ตามศักยภาพ</th><th class="num">เวลา</th><th class="num">เพซ</th></tr>
      ${DISTS.map(d => { const t = vdotTime(fit.v, d.km); return `<tr><td>${d.label}</td><td class="num">${fmtTime(t)}</td><td class="num">${fmtPace(t / d.km)}</td></tr>`; }).join("")}</table>
      <div class="tiny mut" style="margin-top:6px">${fit.manual ? "เวลาคำนวณจากค่า VO2max ที่ใส่ (สูตร VDOT)" : "ค่าประมาณจากผลวิ่ง (สูตร VDOT) ไม่ใช่ผลวัดในแล็บ"} ระยะไกลต้องมีความทนทานรองรับด้วย</div>`;
  }
  vo2 += `<div class="row" style="margin-top:12px;gap:8px"><button class="btn ghost sm" data-act="vo2Form">⌚ ใส่ค่าจากนาฬิกา</button>${(p.vo2log || []).length ? `<button class="linkbtn" data-act="vo2List">ประวัติ (${p.vo2log.length})</button>` : ""}</div>`;
  const pbs = [...(p.pbs || [])].sort((a, b) => a.km - b.km);
  const pbHtml = pbs.length ? pbs.map(b => `<div class="item" data-act="pbForm" data-id="${b.id}"><span class="chip gold">${esc(distLabel(+b.km))}</span><div class="grow"><b>${fmtTime(b.time)}</b> <span class="small mut">· ${fmtPace(b.time / b.km)}/กม.</span><div class="tiny mut">${b.date ? thDateY(b.date) : "ไม่ระบุวันที่"}${b.name ? " · " + esc(b.name) : ""}</div></div><span class="small mut">VO2 ${vdot(+b.km, +b.time).toFixed(1)}</span></div>`).join("") : `<div class="mut small">ยังไม่มี PB</div>`;
  const wkStart = mondayOf(TODAY), mStart = TODAY.slice(0, 8) + "01", yStart = TODAY.slice(0, 5) + "01-01";
  const weeks = []; for (let k = 11; k >= 0; k--) {
    const ws = addDays(wkStart, -7 * k), we = addDays(ws, 6);
    const plan = allSessions().filter(s => s.date >= ws && s.date <= we && RUN_TYPES.includes(s.type)).reduce((t, s) => t + (view(s).km || 0), 0);
    weeks.push({ ws, act: sumKm(runs, ws, we), plan, cur: k === 0 });
  }
  const mx = Math.max(10, ...weeks.map(w => Math.max(w.act, w.plan)));
  const bars = `<div class="bars">${weeks.map(w => `<div class="bcol ${w.cur ? "cur" : ""}" title="${thDate(w.ws)}: ${fmtKm(w.act)} กม.">${w.plan ? `<div class="bplan" style="height:${w.plan / mx * 100}%"></div>` : ""}<div class="bact" style="height:${w.act / mx * 100}%"></div></div>`).join("")}</div>
    <div class="blabels">${weeks.map((w, i) => `<span>${i % 2 === 1 || w.cur ? parseDate(w.ws).getDate() + "/" + (parseDate(w.ws).getMonth() + 1) : ""}</span>`).join("")}</div>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--pri)"></i>วิ่งจริง</span><span><i style="border:1.5px dashed #9cc9a8;background:none"></i>ตามแผน</span></div>`;
  const months = []; for (let k = 5; k >= 0; k--) { const d = parseDate(mStart); d.setMonth(d.getMonth() - k); const s = ds(d); const e = new Date(d); e.setMonth(e.getMonth() + 1); e.setDate(0); months.push({ s, km: sumKm(runs, s, ds(e)) }); }
  const r30 = runs.filter(l => l.date >= addDays(TODAY, -29) && l.date <= TODAY);
  const tSec = r30.reduce((t, l) => t + toSec(l.time), 0), kmT = r30.filter(l => toSec(l.time)).reduce((t, l) => t + (+l.km || 0), 0);
  const byType = RUN_TYPES.map(t => ({ t, km: sumKm(r30.filter(l => l.type === t)) })), tot = byType.reduce((a, b) => a + b.km, 0);
  let streak = 0; for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.end >= TODAY) continue; const pl = w.sessions.filter(s => RUN_TYPES.includes(s.type)).reduce((t, s) => t + (view(s).km || 0), 0); if (pl && sumKm(runs, w.start, w.end) >= pl * 0.8) streak++; else break; }
  const ld = runs.length ? runs.reduce((a, b) => (+b.km > +a.km ? b : a)) : null;

  const logs = [...p.logs].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const hist = logs.length ? logs.map(l => {
    const shoe = shoeById(l.shoe), sec = toSec(l.time), pace = sec && +l.km ? fmtPace(sec / l.km) + "/กม." : "";
    return `<div class="item" data-act="analysis" data-id="${l.id}"><div class="grow"><div><span class="tag t-${l.type}">${TYPE_LABEL[l.type]}</span><b>${thDate(l.date)}</b> <span class="small mut">${TH_DAY_FULL[dow(l.date)]}</span>${isTM(l) ? ' <span class="chip gray">🏃‍♂️ ลู่วิ่ง</span>' : ""}${l.pain ? ' <span class="chip bad">เจ็บ</span>' : ""}</div>
      <div class="small">${[+l.km ? fmtKm(+l.km) + " กม." : "", esc(l.time), pace, "RPE " + l.rpe].filter(Boolean).join(" · ")}</div>
      <div class="tiny mut">${esc(shoeShort(shoe))}${l.note ? " · " + esc(l.note) : ""}</div></div>
      <button class="del" data-act="delLog" data-id="${l.id}">ลบ</button></div>`;
  }).join("") : `<div class="mut small">ยังไม่มีผลซ้อม</div>`;

  return `
  <h2 style="margin-top:4px">VO2max</h2><div class="card">${vo2}</div>
  <div class="row" style="margin:22px 0 10px"><h2 style="margin:0">สถิติ PB</h2><button class="btn ghost sm" data-act="pbForm">＋ เพิ่ม PB</button></div><div class="card">${pbHtml}</div>
  <h2>ระยะสะสม</h2>
  <div class="card">
    <div class="grid4"><div class="box"><b>${fmtKm(sumKm(runs, wkStart, TODAY))}</b><span class="tiny mut">สัปดาห์นี้</span></div><div class="box"><b>${fmtKm(sumKm(runs, mStart, TODAY))}</b><span class="tiny mut">เดือนนี้</span></div><div class="box"><b>${fmtKm(sumKm(runs, yStart, TODAY))}</b><span class="tiny mut">ปีนี้</span></div><div class="box"><b>${fmtKm(sumKm(runs))}</b><span class="tiny mut">ทั้งหมด</span></div></div>
    <div class="small mut" style="margin-top:14px">12 สัปดาห์ล่าสุด (กม.)</div>${bars}
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:6px;justify-content:flex-start">${months.map(m => `<span class="chip gray">${TH_MON[parseDate(m.s).getMonth()]} ${fmtKm(m.km)}</span>`).join("")}</div>

    ${tot ? `<div class="small mut" style="margin-top:12px">สัดส่วนระยะตามประเภท</div><div class="stack">${byType.filter(b => b.km).map(b => `<i style="width:${b.km / tot * 100}%;background:${TYPE_COLOR[b.t]}"></i>`).join("")}</div>
    <div class="legend">${byType.filter(b => b.km).map(b => `<span><i style="background:${TYPE_COLOR[b.t]}"></i>${TYPE_LABEL[b.t]} ${Math.round(b.km / tot * 100)}%</span>`).join("")}</div>
    ${(byType[0].km + byType[1].km) / tot < 0.6 ? `<div class="note warn">วันเบา (Easy + Long) น้อยกว่า 60% ของระยะ — ควรวิ่งเบาเป็นหลักเพื่อลดความเสี่ยงบาดเจ็บ</div>` : ""}` : ""}
    <div class="row small" style="margin-top:12px"><span>ทำตามแผน ≥ 80% ติดกัน</span><b>${streak} สัปดาห์</b></div>

  </div>

  <h2>ประวัติผลซ้อม</h2><div class="card">${hist}</div>`;

/* ---------- ชาเลนจ์ ---------- */
function chValue(ch, p) {
  const L = runLogs(p).filter(l => l.date >= ch.start && l.date <= ch.end);
  if (ch.type === "runs") return L.length;
  if (ch.type === "days") return new Set(L.map(l => l.date)).size;
  if (ch.type === "longest") return L.reduce((m, l) => Math.max(m, +l.km || 0), 0);
  return sumKm(L);
}
function chBoard(ch) {
  const rows = (ch.members || []).map(id => DB.profiles.find(p => p.id === id)).filter(Boolean).map(p => ({ name: p.name, value: chValue(ch, p), me: p.id === DB.active }))
    .concat((ch.guests || []).map(g => ({ name: g.name, value: +g.value || 0, guest: true })));
  return rows.sort((a, b) => b.value - a.value);
}
const chFmt = (ch, v) => ch.type === "runs" || ch.type === "days" ? String(v) : fmtKm(v);
const chState = ch => TODAY < ch.start ? "upcoming" : TODAY > ch.end ? "ended" : "active";
const chOrder = { active: 0, upcoming: 1, ended: 2 };
function renderChallenges() { return chLobbyHtml(P()) + `<div style="margin-top:6px"></div>` + renderLocalChallenges().replace("<h2 style=\"margin:0\">ชาเลนจ์กลุ่ม</h2>", "<h2 style=\"margin:0\">ชาเลนจ์ในเครื่อง</h2>"); }
function renderLocalChallenges() {
  const list = [...(DB.challenges || [])].sort((a, b) => chOrder[chState(a)] - chOrder[chState(b)] || a.end.localeCompare(b.end));
  const cards = list.map(ch => {
    const st = chState(ch), board = chBoard(ch), top = Math.max(ch.target || 0, board[0] ? board[0].value : 0, 1), u = CH_TYPES[ch.type].unit;
    const stTxt = st === "active" ? `เหลือ ${diffDays(TODAY, ch.end) + 1} วัน` : st === "upcoming" ? `เริ่ม ${thDate(ch.start)}` : "จบแล้ว";
    return `<div class="card" data-act="chDetail" data-id="${ch.id}" style="cursor:pointer">
      <div class="row"><b>${esc(ch.name)}</b><span class="chip ${st === "active" ? "" : st === "upcoming" ? "warn" : "gray"}">${stTxt}</span></div>
      <div class="tiny mut">${CH_TYPES[ch.type].label}${ch.target ? ` · เป้า ${chFmt(ch, ch.target)} ${u}` : " · ใครได้มากสุดชนะ"} · ${thDate(ch.start)}–${thDate(ch.end)}</div>
      <div style="margin-top:8px">${board.slice(0, 5).map((r, i) => `<div class="item" style="cursor:inherit;padding:8px 0"><span class="rank r${i + 1}">${i + 1}</span><div class="grow"><div class="row small"><span><b>${esc(r.name)}</b>${r.me ? ' <span class="chip">คุณ</span>' : ""}${r.guest ? ' <span class="tiny mut">(กรอกเอง)</span>' : ""}</span><b>${chFmt(ch, r.value)} ${u}</b></div><div class="bar"><i style="width:${Math.min(100, r.value / top * 100)}%;${ch.target && r.value >= ch.target ? "background:var(--gold)" : ""}"></i></div></div></div>`).join("") || `<div class="mut small">ยังไม่มีสมาชิก</div>`}</div>
    </div>`;
  }).join("");

function copyText(t) {
  const done = () => toast("คัดลอกแล้ว วางใน LINE ได้เลย");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("คัดลอกไม่ได้"); } ta.remove(); };
  try { navigator.clipboard.writeText(t).then(done, fallback); } catch (e) { fallback(); }
}

// เลือกรูป 1 รูป แล้วครอปกลาง/ย่อเป็น W×H (JPEG) — ใช้กับรูปโปรไฟล์และรูปรองเท้า
function pickImage(W, H, cb) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.style.cssText = "position:fixed;left:-9999px;opacity:0"; document.body.appendChild(inp);   // iPhone ต้องอยู่ใน DOM
  inp.onchange = () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const r = Math.max(W / img.width, H / img.height), sw = W / r, sh = H / r;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
      x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
      URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast("เปิดรูปนี้ไม่ได้"); };
    img.src = url;
  };
  inp.click();
}
function pickPhoto() { pickImage(256, 256, d => { P().photo = d; save(); render(); toast("อัปเดตรูปแล้ว"); }); }

// ตรวจความเป็นไปได้ของเป้า: เวลาเตรียมตัว + เทียบศักยภาพ
const MIN_WEEKS = { "5": [3, 6], "10": [5, 8], "half": [8, 12], "full": [12, 16], t1: [6, 10], t2: [8, 14], t3: [12, 18], t4: [16, 24], t5: [20, 32] };   // [ขั้นต่ำ, แนะนำ]
const MIN_BASE  = { "5": 5, "10": 10, "half": 15, "full": 25, t1: 15, t2: 25, t3: 35, t4: 45, t5: 55 };                        // กม./สัปดาห์ที่ควรมีก่อนเริ่ม
function raceCheck(p, race) {
  const out = [], c = rcat(race), wk = Math.floor(diffDays(TODAY, race.date) / 7), tr = isTrail(race);
  const [mn, rec] = MIN_WEEKS[c], dl = tr ? `${raceShort(race)} (${TCAT_TH[c]})` : distLabel(race.km);
  if (race.date < TODAY) return out;
  const pr = race.prio || "A";
  if (pr === "C") return [{ lvl: "ok", t: "วิ่งสนุก: ไม่ปรับตาราง ใช้แทน Easy/Long ของวันนั้น วิ่งตามความรู้สึก ไม่ต้องเค้นเพซ" }];
  if (pr === "B") out.push({ lvl: "info", t: "งานรอง: ตารางงานหลักเดินต่อ ลดโหลด 2–3 วันก่อนแข่ง และฟื้นตัวสั้น ๆ หลังแข่ง ใช้ผลเช็กความฟิตได้ดี" });
  if (pr === "A" && wk < mn) out.push({ lvl: "bad", t: `เหลือ ${wk} สัปดาห์ น้อยไปสำหรับ ${dl} (ควรมีอย่างน้อย ${mn}, แนะนำ ${rec} สัปดาห์) — ตารางจะข้ามช่วงสร้างฐาน ควรตั้งเป้าแบบวิ่งให้จบสบาย ๆ` });
  else if (pr === "A" && wk < rec) out.push({ lvl: "warn", t: `เหลือ ${wk} สัปดาห์ ค่อนข้างกระชับสำหรับ ${dl} (แนะนำ ${rec} สัปดาห์) — ช่วงสร้างฐานจะสั้นกว่าปกติ ซ้อมให้ครบทุกนัดสำคัญ` });
  if (pr === "A" && (+p.weeklyKm || 0) < MIN_BASE[c] && c !== "5") out.push({ lvl: "warn", t: `ตอนนี้วิ่ง ${fmtKm(+p.weeklyKm || 0)} กม./สัปดาห์ ควรมีฐานอย่างน้อย ${MIN_BASE[c]} กม. ก่อนซ้อม ${dl} — แอปจะค่อย ๆ เพิ่มระยะให้` });
  if (tr && !+race.dplus) out.push({ lvl: "warn", t: "ใส่ความสูงขึ้นสะสม (D+) ของสนามด้วย แอปจะวางเป้าการซ้อมขึ้นเนินและคาดการณ์เวลาได้ตรงขึ้น" });
  if (tr && (c === "t3" || c === "t4" || c === "t5")) out.push({ lvl: "info", t: `${c === "t3" ? "เทรลไกล" : "อัลตร้า"}: แผนมี Long Run วัดเป็นชั่วโมง, Long 2 วันติด (Back-to-back), Power hike และซ้อมกิน/อุปกรณ์${c !== "t3" ? " รวมถึงวิ่งกลางคืน" : ""} · Long สูงสุดราว ${LONG_H[c]} ชม.` });
  const fit = fitness(p);
  if (fit) {
    const pot = tr ? trailPot(fit.v, race) : vdotTime(fit.v, race.km);
    const gain = Math.min(0.06, Math.max(0, wk) * 0.005);       // พัฒนาได้ราว 0.5%/สัปดาห์ สูงสุด ~6%
    const reach = pot * (1 - gain), gap = pot - race.target;
    const sug = Math.ceil(reach / 30) * 30;
    if (race.target < reach * 0.985) out.push({ lvl: "bad", t: `เป้า ${fmtTime(race.target)} เร็วกว่าศักยภาพตอนนี้ (${fmtTime(pot)}) ${fmtTime(gap)} — ภายใน ${wk} สัปดาห์น่าจะทำได้ราว ${fmtTime(reach)} ลองตั้ง ${fmtTime(sug)} ก่อนไหม`, suggest: sug });
    else if (race.target < pot) out.push({ lvl: "ok", t: `เป้าท้าทายแต่เป็นไปได้: เร็วกว่าศักยภาพตอนนี้ ${fmtTime(gap)} ถ้าซ้อมตามแผน ${wk} สัปดาห์` });
    else out.push({ lvl: "ok", t: `เป้าอยู่ในศักยภาพตอนนี้ (${fmtTime(pot)}) — ทำได้ถ้าความทนทานพร้อม${race.km > 15 ? " เน้น Long Run" : ""}` });
  } else out.push({ lvl: "info", t: "ใส่ PB ในแท็บ “ฉัน” เพื่อให้แอปเช็กว่าเป้านี้เหมาะกับความฟิตตอนนี้ไหม" });
  if (tr) return out;
  const pb = (p.pbs || []).find(b => sameDist(+b.km, race.km));
  if (pb && race.target < +pb.time) {
    const imp = (+pb.time - race.target) / +pb.time;
    if (imp > 0.06) out.push({ lvl: "warn", t: `เร็วกว่า PB ${dl} เดิม (${fmtTime(pb.time)}) ถึง ${fmtTime(+pb.time - race.target)} (${Math.round(imp * 100)}%) — ความเร็วอาจพอ แต่ต้องสร้างความทนทานเพิ่มมาก${wk < rec ? " และเวลาเตรียมตัวค่อนข้างน้อย" : ""}` });
    else out.push({ lvl: "ok", t: `ทำลาย PB ${dl} เดิม ${fmtTime(+pb.time - race.target)} 💪` });
  }
  return out;
}

        : ag ? `<div class="agbox" style="margin:-4px 0 12px">🏅 ปี ${+agr.date.slice(0, 4) + 543} อายุ ${ag.age} ปี (${+agr.date.slice(0, 4) + 543} − ${birthCE(p) + 543}) → <b>${esc(ag.label)}</b>${ag0 && ag0.label !== ag.label ? `<div class="tiny mut">ปีนี้ยังอยู่รุ่น ${esc(ag0.label)} · ปีแข่งขึ้นรุ่นใหม่แล้ว</div>` : ""}<div class="tiny mut">รุ่นของงาน: ${agBrackets(agr) ? agBrackets(agr).map(agLabel).join(" · ") : "ไม่แบ่งรุ่น"} — เช็กประกาศงานอีกครั้ง บางงานแบ่งต่างกัน</div></div>` : "";
      const ch = T && d && !bad && F.date.value ? checkHtml(raceCheck(p, { ...ro, target: T, date: F.date.value, prio: F.prio.value })) : "", box = body.querySelector(".checks");
