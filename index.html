<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ef">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KAOWIN">
<title>KAOWIN</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Mali:wght@500;600;700&family=Trirong:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7ef; --card:#ffffff; --soft:#dcefdf; --soft2:#f5fbf5;
  --pri:#1f7a52; --pri-d:#0d5a3c; --ink:#17261c; --mut:#66796b; --line:#dfeae1;
  --warn:#a86f0e; --warn-bg:#fdf3dd; --bad:#b9443a; --bad-bg:#fbe7e4; --ok-bg:#e1f3e5; --gold:#e8b931;
  --c-easy:#1f7a52; --c-long:#2f8a86; --c-quality:#d4822a; --c-race:#c9497a; --c-gym:#7a62b8; --c-rest:#9aa79d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box;padding-bottom:0!important}
main{flex:1 0 auto;width:100%;box-sizing:border-box}
.top,.foot{width:100%}
.foot{background:#0d5a3c;color:#e3f4e8;margin-top:8px}
.foot-in{max-width:640px;margin:0 auto;padding:16px 16px calc(150px + env(safe-area-inset-bottom));text-align:left;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;align-items:flex-start}
.foot-in b{color:#fff;font-weight:600;letter-spacing:.2px}
.foot-in span{color:#b9dec6}
.line-btn{display:inline-flex;align-items:center;gap:8px;background:#06c755;color:#fff;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:11px 18px;margin-bottom:4px;min-height:44px;box-sizing:border-box}
.line-btn:hover{background:#05b04b;color:#fff}
.foot-in .line-id{font-size:12px;margin-bottom:12px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(238,247,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;flex:none;display:block}
.wordmark{font-family:"Outfit",sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1;color:var(--pri-d)}
.who{background:none;border:0;padding:0;cursor:pointer;text-align:right;font-size:13px;color:var(--pri-d);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;display:block}
.tagline{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px;white-space:nowrap;letter-spacing:.2px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.slogan{margin:10px auto 0;text-align:center}
.slogan .th{display:block;font-size:30px;font-weight:700;line-height:1.15;color:var(--pri-d);letter-spacing:.5px}
.slogan .en{display:inline-block;font-family:"Outfit",sans-serif;font-weight:800;font-style:italic;font-size:22px;letter-spacing:.3px;line-height:1.3;
  background:linear-gradient(90deg,#0d5a3c 0%,#1f9a5c 45%,#8fd93a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px}
.slogan .bar{display:block;width:56px;height:4px;border-radius:4px;margin:8px auto;background:linear-gradient(90deg,#1f9a5c,#b6ef5a)}
.slogan .desc{display:inline-block;font-size:14px;font-weight:600;color:#0d3d28;background:linear-gradient(90deg,#d6f2dd,#ecf9d4);border:1px solid #c8e8cf;border-radius:16px;padding:8px 18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(150deg,#d3eed9 0%,#f4fbf5 70%);border-color:#cfe7d4}
.big{font-size:42px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.box{background:var(--soft2);border-radius:12px;padding:10px;text-align:center}
.box b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--pri-d);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.pink{background:#f9e1ea;color:#9c2f5a} .chip.gray{background:#eef1ee;color:var(--mut)} .chip.gold{background:#fbf0cc;color:#8a6a06} .chip.brown{background:#f3ead9;color:#7a5a24} .chip.ag{background:#e8f1fb;color:#2b5d8a}
.agbox{background:#eef5fc;border:1px solid #d3e3f3;border-radius:12px;padding:8px 12px;font-size:13px;margin-top:6px;line-height:1.5}.agbox b{color:#1f4f7a}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;background:var(--ok-bg);color:#1f5a33}
.note.warn{background:var(--warn-bg);color:#6e4a08} .note.bad{background:var(--bad-bg);color:#7a2a22} .note.info{background:#eef3fb;color:#2a4a7a} .note.gold{background:#fbf0cc;color:#6b5205}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.warn i{background:#e0a33a} .bar.bad i{background:var(--bad)}
.empty{text-align:center;padding:28px 16px}
.empty p{margin:6px 0 14px;color:var(--mut)}
/* sessions */
.sess{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sess:first-child{border-top:0}
.sess.next{background:var(--soft2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.day{text-align:center;line-height:1.15}
.day b{display:block;font-size:15px} .day span{font-size:11px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;color:#fff;margin-right:6px;vertical-align:1px}
.t-easy{background:var(--c-easy)} .t-long{background:var(--c-long)} .t-quality{background:var(--c-quality)} .t-race{background:var(--c-race)} .t-gym{background:var(--c-gym)} .t-rest{background:var(--c-rest)} .t-fit{background:#ff6b8b}
.sess.add{grid-template-columns:44px 1fr;padding:6px 0;opacity:.75}.sess.add .addb{border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mut);font-weight:600}
.gym-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.gym-sum div{background:var(--soft2);border-radius:14px;padding:10px;text-align:center}.gym-sum b{display:block;font-size:22px;color:var(--ink)}.gym-sum span{font-size:12px;color:var(--mut)}
.gym-step{background:#fff8ea;border:1px solid #f0dcae;border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.ex{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.ex-fig{flex:none;align-self:flex-start;width:112px;height:128px;background:linear-gradient(180deg,#f3faf5,#e4f2e9);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:4px}
.ex-fig svg{width:104px;height:auto}
.ex-body{min-width:0;flex:1}.ex-name{font-weight:700;font-size:16px;line-height:1.3}.ex-name span{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.ex-dose{margin:6px 0;font-size:14px;color:var(--c-gym)}.ex-dose b{color:var(--c-gym)}
.ex ul{margin:0 0 8px 16px;padding:0;font-size:12.5px;color:var(--mut);line-height:1.5}
.ex-sets{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.setdot{width:34px;height:34px;border-radius:50%;border:2px solid var(--c-gym);background:#fff;color:var(--c-gym);font-weight:700;font-size:14px;cursor:pointer}
.setdot.on{background:var(--c-gym);color:#fff}
.sdesc{font-weight:500} .smeta{font-size:12.5px;color:var(--mut)}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-size:14px}
.st.done{background:var(--pri);border-color:var(--pri);color:#fff}
.st.missed{border-color:#e7b9b3;color:var(--bad);background:var(--bad-bg)}
.st.today{border-color:var(--pri);color:var(--pri)}
.st.rest{border:0;background:none}
.adj{font-size:11px;font-weight:600;color:var(--warn);margin-left:4px}
/* plan */
details.week{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.week>summary::-webkit-details-marker{display:none}
details.week[open]>summary{border-bottom:1px solid var(--line);background:var(--soft2)}
.chev{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--soft2);color:var(--pri-d);text-align:center;line-height:22px;font-size:12px;transition:transform .2s;margin-left:6px;vertical-align:middle}
details.week[open] .chev{transform:rotate(180deg)}
.wprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wprev span{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--soft2);color:var(--mut);white-space:nowrap}
.wprev span b{color:var(--ink);font-weight:600}
details.week[open] .wprev{display:none}
.wbody{padding:4px 14px 12px}
.wk{font-weight:700}
.group{margin:22px 0 10px;padding:12px 14px;border-radius:14px;background:#f9e9ef;color:#7a2448;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* lists */
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.del{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:4px}
.linkbtn{background:none;border:0;color:var(--pri-d);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0}
/* charts */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:12px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bplan{position:absolute;bottom:0;left:0;right:0;border:1.5px dashed #b9d8c0;border-bottom:0;border-radius:6px 6px 0 0}
.bact{position:relative;width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.bcol.cur .bact{background:#9ad94a}
.blabels{display:flex;gap:5px;margin-top:4px}
.blabels span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.vo2{display:flex;align-items:flex-end;gap:14px}
.vo2 .big{font-size:48px;color:var(--pri-d)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft2);color:var(--mut);flex:none}
.rank.r1{background:#fbe7a6;color:#7a5a00} .rank.r2{background:#e6eaee;color:#4a5560} .rank.r3{background:#f3d9c4;color:#7a4316}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:var(--soft);color:var(--pri-d)} .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)} .btn.danger{background:#fff;border:1px solid #efc9c4;color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:grid;gap:10px;margin-top:6px}
.fab{border-radius:999px;padding:13px 18px;box-shadow:0 8px 20px rgba(42,114,67,.28)}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{color:var(--pri-d);font-weight:700}
.tabs svg{width:22px;height:22px}
/* sheet + forms */
.tipscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:2px 0 6px}.tipscroll::-webkit-scrollbar{display:none}
.tipbar{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;font:inherit;font-size:13px;line-height:1.35;text-align:left;cursor:pointer;border:1px solid}
.tipbar .ic{font-size:20px;flex:none}.tipbar .tx{flex:1;min-width:0}.tipbar .tx b{display:block;font-size:13.5px}.tipbar .go{flex:none;font-weight:700;opacity:.7}
.tipbar.red{background:#fdecea;border-color:#f3c3bd;color:#8e2a20}.tipbar.amber{background:#fff6e0;border-color:#f0dcae;color:#7a5306}.tipbar.green{background:#e9f6ee;border-color:#c5e6d2;color:#0d5a3c}
.tipdots{display:flex;gap:4px;justify-content:center;margin:0 0 12px}.tipdots i{width:5px;height:5px;border-radius:3px;background:#c9dcd0;transition:width .2s}.tipdots i.on{background:#0d5a3c;width:14px}
.kb .sev{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}.kb .sev.red{background:#fdecea;color:#b3261e}.kb .sev.amber{background:#fff6e0;color:#8a5a00}.kb .sev.green{background:#e9f6ee;color:#0d5a3c}
.kb h4{margin:14px 0 6px;font-size:14px}
.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.foodgrid div{border-radius:12px;padding:10px;font-size:12.5px;line-height:1.55;background:#f5fbf5;border:1px solid var(--line)}.foodgrid div:last-child{background:#fff8ea;border-color:#f0dcae}.foodgrid b{display:block;font-size:13.5px;margin-bottom:4px}.kb ul,.kb ol{margin:0 0 6px 18px;padding:0;font-size:13.5px;line-height:1.6}
.callbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:#e2453c;color:#fff!important;text-decoration:none;border-radius:14px;padding:12px;font-weight:800;font-size:16px;margin:12px 0 4px}
.kbgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.kbgrid button{border:1px solid var(--line);border-radius:12px;padding:9px 10px;font:inherit;font-size:12.5px;text-align:left;background:#fff;cursor:pointer;color:var(--ink)}.kbgrid button.red{border-left:4px solid #e2453c}.kbgrid button.amber{border-left:4px solid #e0a83a}.kbgrid button.green{border-left:4px solid #3aa06a}
.cx-hero{position:relative;overflow:hidden;border-radius:24px;padding:16px 16px 14px;color:#fff;cursor:pointer;background:radial-gradient(120% 140% at 100% 0%,#1f8a5b 0%,#0d5a3c 45%,#073826 100%);box-shadow:0 18px 40px rgba(7,56,38,.3);margin-bottom:14px}
.cx-hero:after{content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,245,96,.22),transparent 65%);pointer-events:none}
.cx-lbl{font-size:11.5px;letter-spacing:.06em;opacity:.8;font-weight:700}
.cx-row{display:flex;gap:14px;align-items:center;margin-top:10px;position:relative;z-index:1}
.cx-ring{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#c8f560 calc(var(--p)*1%),rgba(255,255,255,.14) 0);position:relative}
.cx-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0b4d34}.cx-ring b{position:relative;font-family:Outfit,sans-serif;font-size:26px;line-height:1}.cx-ring span{position:absolute;bottom:20px;font-size:10px;opacity:.7}
.cx-info{flex:1;min-width:0}.cx-info .t{font-weight:800;font-size:16.5px;line-height:1.25}.cx-info .s{font-size:12.5px;opacity:.82;margin-top:3px}
.cx-pill{display:inline-flex;align-items:baseline;gap:4px;margin-top:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:12.5px}.cx-pill b{font-family:Outfit,sans-serif;font-size:20px;color:#c8f560}
.cx-up{color:#c8f560;font-weight:700;font-size:12px;margin-left:6px}
.cx-mini{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.08);position:relative;z-index:1;font-size:12.5px}.cx-mini b{color:#c8f560}
.cx-bar{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}.cx-bar i{display:block;height:100%;background:#c8f560;border-radius:4px}
.cx-foot{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;position:relative;z-index:1}
.cx-promo{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 14px;padding:12px 14px;border:0;border-radius:18px;color:#fff;font:inherit;cursor:pointer;background:linear-gradient(120deg,#0d5a3c,#1f8a5b);box-shadow:0 10px 24px rgba(7,56,38,.25)}
.cx-sech{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}.cx-sech h2{margin:0}.cx-sech span{font-size:12px;color:var(--mut)}
.cx-lob{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx-lc{position:relative;overflow:hidden;border-radius:20px;padding:14px 12px 12px;color:#fff;min-height:150px;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(0,0,0,.12);cursor:pointer}
.cx-em{font-size:30px}.cx-n{font-weight:800;font-size:15px;line-height:1.25;margin-top:6px}.cx-m{font-size:11.5px;opacity:.85;margin-top:2px}
.cx-ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.cx-avck{display:flex;align-items:center;gap:8px}.cx-avck img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.cx-av{display:flex}.cx-av i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.9);margin-left:-7px;display:grid;place-items:center;font-style:normal;font-size:11px;color:#333;font-weight:700}.cx-av i:first-child{margin-left:0}

.cx-lr .nm{flex:1;min-width:0}.cx-lr .nm small{display:block;color:var(--mut);font-size:11px}.cx-lr .bv{width:64px;height:5px;border-radius:3px;background:#e7efe9;overflow:hidden;flex:none}.cx-lr .bv i{display:block;height:100%;background:#1f8a5b}

.cx-mebar .no{font-family:Outfit,sans-serif;font-size:22px;font-weight:800;color:#c8f560}.cx-mebar small{opacity:.8}
.cx-an{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.cx-an div{background:linear-gradient(90deg,#0d5a3c,#1f8a5b);color:#fff;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
body.lv-on{overflow:hidden}
#live{position:fixed;inset:0;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
#live.hidden{display:none}
.fabs{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:8px;align-items:center}
.fab-st{position:absolute;right:0;bottom:calc(100% + 10px);border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;font-size:14px;background:linear-gradient(135deg,#ffb020,#ff6a00);color:#fff;box-shadow:0 8px 20px rgba(255,106,0,.35);cursor:pointer}
.fab-st[hidden]{display:none}
.fab-live{border-radius:999px;padding:13px 16px;background:#14231a;color:#d9f99d;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.lv-setup{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.lv-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.lv-x{background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:6px}
.lv-warn{background:linear-gradient(180deg,#fff4ea,#ffe9d9);border:2px solid #f0a060;border-radius:18px;padding:14px 16px;color:#5a2d0c}
.lv-warn>b{font-size:17px;color:#c2410c}
.lv-warn ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.6}
.lv-ack{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:600;cursor:pointer}
.lv-ack input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.lv-plan{background:#f0f9e8;border:1px solid #cfe8b8;border-radius:14px;padding:10px 12px;font-size:13.5px;color:#2b4a1d;margin-bottom:10px}
.lv-lab{font-weight:700;margin:6px 0}
.lv-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.lv-chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.lv-chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.lv-row .lv-chip{padding:6px 11px;font-size:13px}
.lv-row .lv-chip.on{background:#d9f99d;border-color:#bef264;color:#1a2e05}
.lv-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lv-ct{font-weight:700;margin-bottom:4px}
.lv-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.lv-row:last-of-type{border-bottom:0}
.lv-row>span{color:var(--mut);flex:1 1 auto;min-width:0}
.lv-row>div{flex:none;max-width:72%;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.lv-in{width:62px;padding:7px 8px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;text-align:center;background:var(--bg);color:var(--ink)}
.lv-in.w{width:80px}
.lv-sel{padding:7px 8px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.lv-stp{display:flex;align-items:center;gap:12px}
.lv-stp b{min-width:56px;text-align:center;font-size:16px}
.lv-stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--soft2);font-size:18px;cursor:pointer;color:var(--ink)}
.lv-test{margin-top:8px;border:1px dashed var(--line);background:none;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.lv-sq{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:14px}
.lv-sq i{width:10px;height:10px;border-radius:50%;flex:none}
.lv-sq i.b{background:#3b82f6}.lv-sq i.o{background:#f08a35}.lv-sq i.g{background:#22a35a}
.lv-go{display:block;width:100%;margin:14px 0 8px;border:0;border-radius:22px;padding:18px;font:inherit;font-size:22px;font-weight:800;color:#14231a;background:linear-gradient(180deg,#d9f99d,#a3e635);box-shadow:0 10px 24px rgba(132,204,22,.35);cursor:pointer}
.lv-go:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.lv-gps{text-align:center;font-size:13px;color:var(--mut)}
.lv-gps .ok{color:#22a35a}.lv-gps .wait{color:#d97706}.lv-gps .bad{color:var(--bad)}
/* ระหว่างวิ่ง (จอมืด) */
.lv-run{min-height:100%;background:#0b130e;color:#eef5ef;padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;position:relative;box-sizing:border-box}
#live:has(.lv-run){background:#0b130e}
.lv-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cfe3d4;padding:4px 2px 8px}
#lvBars{display:inline-flex;align-items:flex-end;gap:2px}
#lvBars i{display:inline-block;width:4px;background:#334;border-radius:1px}
#lvBars i.on{background:#bef264}
#lvBars em{color:#f87171;font-style:normal;margin-left:3px}
.lv-lock.off{border-color:#c2410c;background:#3a1a06;color:#fed7aa;text-align:left;line-height:1.5}.lv-lock.off b{color:#fff}
.sc-wrap{background:#111;border-radius:16px;overflow:hidden;display:flex;justify-content:center;margin-bottom:12px}.sc-wrap.clear{background:repeating-conic-gradient(#7d8a82 0 25%,#9aa69f 0 50%) 0 0/22px 22px;padding:14px}
.sc-tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.sc-tpl button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}.sc-tpl button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sc-seg{margin-bottom:10px}.sc-wrap canvas{display:block;max-width:100%;max-height:58vh;width:auto;height:auto}
.lv-lock{border:1px solid #3c5a1d;background:#16240f;color:#d9f99d;border-radius:12px;padding:7px 12px;font-size:12.5px;text-align:center}
.lv-pill{width:max-content;max-width:100%;margin:12px auto 4px;border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
.lv-pill.o{background:#f08a35;color:#2a1302}.lv-pill.b{background:#1e3a5f;color:#bfdbfe}.lv-pill.bl{background:#3b82f6;color:#fff}.lv-pill.g{background:#166534;color:#dcfce7}
.lv-big{text-align:center;margin:14px 0 10px}
.lv-big b{display:block;font-size:min(30vw,132px);line-height:1;font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.lv-big span{font-size:15px;color:#cfe3d4}
.lv-grid{display:grid;grid-template-columns:1fr 1fr;background:#121d16;border-radius:18px;overflow:hidden;margin:8px 0}
.lv-grid>div{text-align:center;padding:12px 6px;border:0 solid #1f2d24;border-right-width:1px;border-bottom-width:1px}
.lv-grid>div:nth-child(2n){border-right-width:0}
.lv-grid b{display:block;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.lv-grid b.hl{color:#d9f99d}.lv-grid b.slow,.lv-grid b.fast{color:#f59e5b}
.lv-grid span{font-size:12.5px;color:#9fb6a6}
.lv-ringw{position:relative;width:min(70vw,280px);margin:6px auto}
.lv-ringw svg{width:100%;display:block}
.lv-ringw circle{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.lv-ringw circle.bg{stroke:#1f2b23}
.lv-ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv-ringc b{font-size:min(17vw,76px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.lv-ringc span{font-size:13px;color:#cfe3d4;margin-top:4px}
.lv-zone{background:#121d16;border-radius:14px;padding:10px 14px;margin:8px 0}
.lv-zt{display:flex;justify-content:space-between;font-size:13.5px}
.lv-zt b.ok{color:#bef264}.lv-zt b.slow,.lv-zt b.fast{color:#f59e5b}
.lv-bar{position:relative;height:9px;border-radius:9px;margin:9px 0 4px}
.lv-bar i{position:absolute;top:-5px;width:6px;height:19px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px #0b130e;transition:left .8s}
.lv-zl{display:flex;justify-content:space-between;font-size:11px;color:#8aa293}
.lv-info{text-align:center;font-size:13.5px;color:#cfe3d4;margin:8px 0}
.lv-next{display:flex;justify-content:space-between;background:#121d16;border-radius:14px;padding:11px 14px;margin:8px 0;font-size:14px}
.lv-next span{color:#9fb6a6}
.lv-rep{background:#121d16;border-radius:14px;padding:10px 14px;margin:8px 0}
.lv-rr{display:flex;justify-content:space-between;font-size:16px;margin:4px 0}
.lv-rep .ok,.lv-reps .ok{color:#22a35a}.lv-rep .warn,.lv-reps .warn{color:#e07b2a}
.lv-rep b.ok{color:#bef264}
.lv-dots{display:flex;justify-content:center;gap:6px;margin:10px 0}
.lv-dots i{width:26px;height:7px;border-radius:5px;background:#2b3a30}
.lv-dots i.d{background:#bef264}.lv-dots i.c{background:#fff}
.lv-said{background:#121d16;border-radius:12px;padding:9px 12px;font-size:13px;color:#cfe3d4;margin:8px 0;min-height:18px}
.lv-said:empty{display:none}
.lv-al{display:flex;gap:12px;align-items:center;background:#f08a35;color:#2a1302;border-radius:18px;padding:12px 16px;margin:8px 0;box-shadow:0 8px 28px rgba(240,138,53,.35)}
.lv-al.hidden{display:none}
.lv-al>span{font-size:28px}.lv-al b{font-size:19px}
.lv-ctl{display:flex;justify-content:center;gap:22px;margin:16px 0 4px}
.lv-b{width:84px;height:84px;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;cursor:pointer;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.lv-b b{font-size:22px;line-height:1}.lv-b span{font-size:11px;margin-top:4px;position:relative}
.lv-b.y{background:#d9f99d;color:#14231a}
.lv-b.s{background:#1e3a5f;color:#dbeafe}
.lv-b.k{background:#26332b;color:#fff;border:2px solid #3a4a40}
.lv-b.k i{position:absolute;left:0;bottom:0;width:100%;height:0;background:#e5484d;transition:height .15s}
.lv-b.k.holding i{height:100%;transition:height 1.2s linear}
.lv-b.k b,.lv-b.k span{position:relative;z-index:1}
.lv-pz{text-align:center;color:#fbbf24;font-size:14px;margin-top:6px}
.lv-run.paused .lv-big b,.lv-run.paused .lv-ringc b{opacity:.55}
.lv-gap{position:absolute;inset:0;background:rgba(5,10,7,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding-top:22vh;z-index:3}
.lv-gap>div{background:#e5484d;color:#fff;border-radius:22px;padding:18px;margin:0 14px;text-align:center;box-shadow:0 14px 40px rgba(229,72,77,.4)}
.lv-gap b{font-size:19px}.lv-gap p{margin:8px 0 14px;font-size:14px;line-height:1.5}
.lv-gap button{width:100%;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;font-size:16px;color:#e5484d;background:#fff;cursor:pointer}
.lv-cd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.lv-cdn{font-size:180px;font-weight:800;color:#d9f99d;line-height:1}
.lv-cdl{color:#cfe3d4;font-size:18px}
/* สรุป */

.lv-sh{background:linear-gradient(160deg,#1f6b3f,#14532d);color:#fff;border-radius:0 0 26px 26px;margin:0 -16px 12px;padding:18px 20px 16px}

.lv-shg b{display:block;font-size:24px}.lv-shg span{font-size:12px;color:#cdeed8}
.lv-route{width:100%;display:block}
.lv-reps>div{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.2fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.wx-card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:linear-gradient(160deg,#eef8f1,#e3f1e8);border:1px solid #cfe5d6;border-radius:18px;padding:12px 14px;margin:0 0 12px;cursor:pointer}

.wt-big{width:170px;text-align:center;border:0;outline:0;font-family:Outfit,sans-serif;font-weight:800;font-size:56px;background:transparent;color:var(--ink)}

.wx-card.lv1{background:linear-gradient(160deg,#fffbe8,#fff3c4);border-color:#f2df8f}
.wx-card.lv2{background:linear-gradient(160deg,#fff3e6,#ffe0c2);border-color:#f5b77a}
.wx-card.lv3{background:linear-gradient(160deg,#ffecec,#ffd3d3);border-color:#f19a9a}
.wx-top{display:flex;align-items:center;gap:10px}
.wx-ic{font-size:34px;line-height:1}
.wx-t b{display:block;font-family:Outfit,sans-serif;font-size:30px;line-height:1}
.wx-t span{font-size:12px;color:var(--mut)}
.wx-pl{flex:1;min-width:0;text-align:right}
.wx-pl b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.steps{counter-reset:s;margin:4px 0 14px;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:var(--soft2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.kbd svg{width:16px;height:16px}
.celebrate .mid{color:var(--pri-d)}
@media (max-width:380px){.big{font-size:36px}.mid{font-size:22px}.tabs button{font-size:10px}.grid4{grid-template-columns:repeat(2,1fr)}}
</style>

function achievementsFor(p, l) {

    const f5 = prev.filter(x => +x.km >= 5 && toSec(x.time) && !steepLog(x) && !isTM(x)).map(x => toSec(x.time) / +x.km);
    if (km >= 5 && sec && !steepLog(l) && !isTM(l) && f5.length >= 3 && sec / km < Math.min(...f5) - 1) add("fast-" + l.id, "rec", "เร็วสุด", "เพซเร็วที่สุดของการวิ่ง 5 กม.ขึ้นไป!", `${fmtPace(sec / km)}/กม. (เดิม ${fmtPace(Math.min(...f5))})`);

  return out;
}
function showAch(list, l) {

  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-ach]"); if (!b && e.target !== el) return;
    if (b && b.dataset.ach === "share" && l && RUN_TYPES.includes(l.type)) { el.classList.add("out"); setTimeout(() => el.remove(), 250); shareCard(l.id); return; }

const TIP_ROT = ["heat", "heart", "fuel", "hypona", "injury", "carb", "easy", "heart", "cramp", "bonk", "heat", "rhabdo", "sick", "hot", "heatex", "carb"];   // raceday/recovery ขึ้นเฉพาะช่วงแข่ง
const dayNo = d => Math.floor(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5);
function tipsFor(p) {
  const out = [], push = id => { if (TIPS[id] && !out.includes(id)) out.push(id); }, dn = dayNo(TODAY), odd = dn % 2;
  const seed = [...String(p.id || p.name || "")].reduce((t, c) => t + c.charCodeAt(0), 0);
  // ---- เหตุพิเศษของคนนี้ ----
  if (PAIN) push("injury");
  const up = sortedRaces(p).find(r => r.date >= TODAY && diffDays(TODAY, r.date) <= 3);
  if (up) { push("raceday"); if (LONGCATS.includes(rcat(up))) push("carb"); }
  const past = sortedRaces(p).filter(r => r.date < TODAY && diffDays(r.date, TODAY) <= 3).pop() || runLogs(p).find(l => l.type === "race" && l.date < TODAY && diffDays(l.date, TODAY) <= 3);
  if (past) push("recovery");
  const longSoon = allSessions().find(s => (s.date === TODAY || s.date === addDays(TODAY, 1)) && view(s).type === "long");
  const mr = mainRace(p);
  if (longSoon) { if (mr && isTrail(mr) && odd) push("trail"); else if ((view(longSoon).km || 0) >= 18 && odd) push("hypona"); else push("fuel"); }
  const ref = hrRef(p), recent = runLogs(p).filter(l => l.date >= addDays(TODAY, -3));
  if (recent.some(l => (l.type === "easy" || l.type === "long") && l.hrAvg && ref && l.hrAvg / ref >= 0.88)) push("heatex");
  if (recent.some(l => (l.walkSec && toSec(l.time) && l.walkSec / toSec(l.time) > 0.1) || /ตะคริว/.test(l.note || ""))) push("cramp");
  const mo = +TODAY.slice(5, 7); if (mo >= 3 && mo <= 5) push(odd ? "heat" : "hot");
  if (p.level === "beginner" && p.startedOn && diffDays(p.startedOn, TODAY) <= 21) push(odd ? "heart" : "easy");
  if (mr && isTrail(mr) && dn % 5 === 0) push("trail");
  // ---- ไม่มีเหตุพิเศษ: วนวันละเรื่อง (แต่ละคนเริ่มคนละจุด) ----
  for (let k = 0; out.length < 5 && k < TIP_ROT.length; k++) push(TIP_ROT[(dn + seed + k) % TIP_ROT.length]);
  return out;
}

}

// เลือกรูป 1 รูป แล้วครอปกลาง/ย่อเป็น W×H (JPEG) — ใช้กับรูปโปรไฟล์และรูปรองเท้า
function pickImage(W, H, cb) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.style.cssText = "position:fixed;left:-9999px;opacity:0"; document.body.appendChild(inp);   // iPhone ต้องอยู่ใน DOM
  inp.onchange = () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const r = Math.max(W / img.width, H / img.height), sw = W / r, sh = H / r;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
      x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
      URL.revokeObjectURL(url); cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast("เปิดรูปนี้ไม่ได้"); };
    img.src = url;
  };
  inp.click();
}

function longExtra(d) {          // ส่วนพิเศษใน Long Run: ช่วงท้ายเร่ง / ท่อนเพซแข่ง
  const o = [], mF = /ช่วงท้าย\s*([\d.–-]+)\s*กม\.\s*(Steady|@เพซแข่ง)/.exec(d), mS = /(\d+)\s*[×x]\s*([\d.]+)\s*กม\.\s*@เพซแข่ง/.exec(d);
  if (mF) o.push(`ช่วงท้าย ${mF[1]} กม.: เร่งขึ้นเป็น${mF[2] === "Steady" ? "เพซ Steady (เหนื่อย 6/10 เร็วกว่า Easy ราว 20–30 วิ/กม.)" : "เพซแข่ง"} จนจบ — ฝึกวิ่งเร็วตอนขาล้า`);
  if (mS) o.push(`ระหว่างทาง ทำ ${mS[1]} ท่อน × ${mS[2]} กม. ที่เพซแข่ง คั่นด้วยวิ่งเบา 1–2 กม.`);
  if (/เติมน้ำ|เจล/.test(d)) o.push("ซ้อมเติมน้ำ/เจลแบบวันแข่ง: จิบน้ำทุก 15–20 นาที กินเจลทุก 30–45 นาที ให้ท้องคุ้น");
  return o;
}

    else out.push({ lvl: "ok", t: `เป้าอยู่ในศักยภาพตอนนี้ (${fmtTime(pot)}) — ทำได้ถ้าความทนทานพร้อม${race.km > 15 ? " เน้น Long Run" : ""}` });

      ${mode === "set" ? `<p class="small mut" style="margin-top:0">ตั้งรหัสครั้งแรก (อย่างน้อย 4 ตัว) — คนอื่นที่แตะเลขเวอร์ชันจะเปิดไม่ได้ถ้าไม่รู้รหัสนี้ จดไว้ด้วยนะ</p>` : ""}
      <label class="f">รหัส<input name="k" type="password" inputmode="text" autocomplete="off" minlength="4" required></label>
      ${mode === "set" ? `<label class="f">ใส่รหัสอีกครั้ง<input name="k2" type="password" autocomplete="off" minlength="4" required></label>` : ""}
      <button class="btn block" type="submit">${mode === "set" ? "ตั้งรหัสและดูสถิติ" : "ดูสถิติ"}</button></form>`,
      body => body.querySelector("#admKey").addEventListener("submit", async e => {
        e.preventDefault(); const F = e.target.elements, k = F.k.value.trim(), btn = e.target.querySelector("button");
        if (mode === "set") {
          if (k !== F.k2.value.trim()) return toast("รหัส 2 ช่องไม่ตรงกัน");
          btn.disabled = true; try { await chApi("/admin/setkey", { key: k }); } catch (er) { btn.disabled = false; return toast(er.message === "short" ? "รหัสสั้นไป ใส่อย่างน้อย 4 ตัว" : er.message === "admin" ? "มีคนตั้งรหัสไว้แล้ว — ใส่รหัสเดิม" : "เชื่อมต่อไม่ได้ ลองใหม่"); }
        }
        lsSet("kaowin.admin", k); statsSheet();
      }));
  };
  if (!key && msg !== "load") return statsSheet.mode ? form(statsSheet.mode) : (statsSheet.mode = "ask", statsSheet("load"));
  openSheet("📊 สถิติผู้ใช้", `<div class="mut small" style="text-align:center;padding:30px">กำลังโหลด…</div>`);
  const APP = statsSheet.app || "kaowin";
  let r; try { r = await chApi("/admin/stats", { admin: key, app: APP }); } catch (e) {
    if (e.message === "nokey") { statsSheet.mode = "set"; msg = ""; return form("set"); }
    if (e.message === "admin") { lsSet("kaowin.admin", ""); statsSheet.mode = "ask"; msg = key ? "รหัสไม่ถูกต้อง ลองใหม่" : ""; return form("ask"); }
    $("#sheetBody").innerHTML = `<div class="note warn">${/not found|404/.test(e.message) ? "Worker ยังเป็นเวอร์ชันเก่า — วางโค้ด Worker ใหม่ก่อน" : "เชื่อมต่อไม่ได้ — " + esc(e.message)}</div>`; return; }
  lsSet("kaowin.owner", "1"); ownerBtn();           // ผ่านรหัสแล้ว = เครื่องเจ้าของ → โชว์ปุ่มสถิติ
  const t = r.tot, D = Object.entries(r.days), mx = Math.max(1, ...D.map(([, v]) => v.act));
  const tile = (n, l, sub) => `<div class="card" style="margin:0;padding:12px;text-align:center"><div style="font-size:26px;font-weight:800">${n}</div><div class="tiny">${l}</div>${sub ? `<div class="tiny mut">${sub}</div>` : ""}</div>`;
  const dd = d => { const [y, m, x] = d.split("-"); return `${+x}/${+m}`; };
  const tabs = [["kaowin", "🏃 KAOWIN"], ["sea", "🌊 Sea To University"]].map(([k, n]) => `<button type="button" class="seg-b${k === APP ? " on" : ""}" data-stapp="${k}" style="flex:1;border:0;border-radius:999px;padding:9px 6px;font:inherit;font-weight:700;cursor:pointer;${k === APP ? "background:#1f8a5b;color:#fff" : "background:transparent;color:inherit"}">${n}</button>`).join("");
  $("#sheetBody").innerHTML = `<div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(31,138,91,.1);margin-bottom:12px">${tabs}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${tile(t.devices, "เครื่องทั้งหมด", `ใหม่วันนี้ ${t.newToday} · 7 วัน ${t.new7}`)}${tile(t.installed, "ติดตั้งเป็นแอพ", `วันนี้ ${t.instToday} · 7 วัน ${t.inst7}`)}${t.members == null ? tile(t.inst7, "ติดตั้ง 7 วัน", "") : tile(t.members, "อยู่ในชาเลนจ์", "")}
      ${tile(t.dau, "ใช้งานวันนี้", "")}${tile(t.wau, "ใช้งาน 7 วัน", "")}${tile(t.mau, "ใช้งาน 30 วัน", "")}</div>
    <h3 style="margin:16px 0 6px">14 วันล่าสุด</h3>
    <div class="tiny mut" style="display:grid;grid-template-columns:44px 1fr 34px 34px 34px;gap:4px;align-items:center"><b>วันที่</b><b>ใช้งาน</b><b>ใหม่</b><b>ติดตั้ง</b><b></b>
      ${D.map(([d, v]) => `<span>${dd(d)}</span><span style="display:flex;align-items:center;gap:6px"><i style="display:block;height:10px;border-radius:5px;background:var(--brand,#1f8a5b);width:${Math.max(2, v.act / mx * 100)}%"></i>${v.act}</span><span>${v.nw || ""}</span><span>${v.inst || ""}</span><span></span>`).join("")}</div>
    <p class="tiny mut" style="margin-top:12px">ระบบ: ${Object.entries(r.os).map(([k, n]) => `${{ ios: "iPhone/iPad", android: "Android", desktop: "คอม", other: "อื่น ๆ" }[k] || k} ${n}`).join(" · ")}<br>${APP === "sea" ? "ระดับชั้น" : "โหมด"}: ${Object.entries(r.mode).map(([k, n]) => `${{ fit: "ฟิตที่บ้าน", run: "วิ่ง", lower: "ม.ต้น", upper: "ม.ปลาย" }[k] || "ยังไม่เลือก"} ${n}`).join(" · ")}<br>นับเครื่องละครั้งต่อวันตอนเปิดแอพ (ต่อเน็ต) · เครื่องที่ใช้มาก่อนมีตัวนับ จะถูกนับย้อนไปวันที่เริ่มใช้จริงตอนเปิดแอพครั้งถัดไป (วันติดตั้งของคนกลุ่มนี้เป็นค่าประมาณ)</p>`;
  $("#sheetBody").querySelectorAll("[data-stapp]").forEach(b => b.addEventListener("click", () => { statsSheet.app = b.dataset.stapp; statsSheet(); }));
}
// ปุ่มสถิติลอยเหนือ "ส่งผลซ้อม" — โชว์เฉพาะเครื่องเจ้าของ (เปิดครั้งแรกด้วยการแตะเลขเวอร์ชัน 5 ครั้ง หรือลิงก์ #owner)
const ownerOn = () => { try { return localStorage.getItem("kaowin.owner") === "1"; } catch (e) { return false; } };
function ownerBtn() { const b = document.getElementById("fabStats"); if (b) b.hidden = !ownerOn(); }
document.getElementById("fabStats").addEventListener("click", e => { e.stopPropagation(); statsSheet.mode = ""; statsSheet(); });
ownerBtn();
{ let n = 0, tm = 0; const v = document.getElementById("appVer"); if (v) v.addEventListener("click", () => { clearTimeout(tm); tm = setTimeout(() => n = 0, 1500); if (++n >= 5) { n = 0; statsSheet.mode = ""; statsSheet(); } }); }
lvBind(); fitBind(); setTimeout(lvRecover, 600);
try { const m = location.hash.match(/admin=([^&]+)/); if (m) { localStorage.setItem("kaowin.admin", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); } } catch (e) {}
setTimeout(() => { const p = P(); const me = chMonthEnd(p); if (me.length) showAch(me, null); if (CH_API) chSync(p); }, 1200);
if (DB.profiles.some(p => p.onboarded)) track("active-user");
</script>
