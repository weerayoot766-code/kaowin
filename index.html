<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef7ef">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KAOWIN">
<title>KAOWIN</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef7ef; --card:#ffffff; --soft:#dcefdf; --soft2:#f5fbf5;
  --pri:#1f7a52; --pri-d:#0d5a3c; --ink:#17261c; --mut:#66796b; --line:#dfeae1;
  --warn:#a86f0e; --warn-bg:#fdf3dd; --bad:#b9443a; --bad-bg:#fbe7e4; --ok-bg:#e1f3e5; --gold:#e8b931;
  --c-easy:#1f7a52; --c-long:#2f8a86; --c-quality:#d4822a; --c-race:#c9497a; --c-gym:#7a62b8; --c-rest:#9aa79d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{display:flex;flex-direction:column;min-height:100vh;box-sizing:border-box;padding-bottom:0!important}
main{flex:1 0 auto;width:100%;box-sizing:border-box}
.top,.foot{width:100%}
.foot{background:#0d5a3c;color:#e3f4e8;margin-top:8px}
.foot-in{max-width:640px;margin:0 auto;padding:16px 16px calc(78px + env(safe-area-inset-bottom));text-align:left;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column;align-items:flex-start}
.foot-in b{color:#fff;font-weight:600;letter-spacing:.2px}
.foot-in span{color:#b9dec6}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(238,247,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;flex:none;display:block}
.wordmark{font-family:"Outfit",sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;line-height:1;color:var(--pri-d)}
.who{background:none;border:0;padding:0;cursor:pointer;text-align:right;font-size:13px;color:var(--pri-d);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;display:block}
.tagline{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px;white-space:nowrap;letter-spacing:.2px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.slogan{margin:10px auto 0;text-align:center}
.slogan .th{display:block;font-size:30px;font-weight:700;line-height:1.15;color:var(--pri-d);letter-spacing:.5px}
.slogan .en{display:inline-block;font-family:"Outfit",sans-serif;font-weight:800;font-style:italic;font-size:22px;letter-spacing:.3px;line-height:1.3;
  background:linear-gradient(90deg,#0d5a3c 0%,#1f9a5c 45%,#8fd93a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4px}
.slogan .bar{display:block;width:56px;height:4px;border-radius:4px;margin:8px auto;background:linear-gradient(90deg,#1f9a5c,#b6ef5a)}
.slogan .desc{display:inline-block;font-size:14px;font-weight:600;color:#0d3d28;background:linear-gradient(90deg,#d6f2dd,#ecf9d4);border:1px solid #c8e8cf;border-radius:16px;padding:8px 18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(150deg,#d3eed9 0%,#f4fbf5 70%);border-color:#cfe7d4}
.big{font-size:42px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
.box{background:var(--soft2);border-radius:12px;padding:10px;text-align:center}
.box b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--pri-d);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.pink{background:#f9e1ea;color:#9c2f5a} .chip.gray{background:#eef1ee;color:var(--mut)} .chip.gold{background:#fbf0cc;color:#8a6a06}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px;background:var(--ok-bg);color:#1f5a33}
.note.warn{background:var(--warn-bg);color:#6e4a08} .note.bad{background:var(--bad-bg);color:#7a2a22} .note.info{background:#eef3fb;color:#2a4a7a} .note.gold{background:#fbf0cc;color:#6b5205}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.warn i{background:#e0a33a} .bar.bad i{background:var(--bad)}
.empty{text-align:center;padding:28px 16px}
.empty p{margin:6px 0 14px;color:var(--mut)}
/* sessions */
.sess{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sess:first-child{border-top:0}
.sess.next{background:var(--soft2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.day{text-align:center;line-height:1.15}
.day b{display:block;font-size:15px} .day span{font-size:11px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;color:#fff;margin-right:6px;vertical-align:1px}
.t-easy{background:var(--c-easy)} .t-long{background:var(--c-long)} .t-quality{background:var(--c-quality)} .t-race{background:var(--c-race)} .t-gym{background:var(--c-gym)} .t-rest{background:var(--c-rest)}
.sdesc{font-weight:500} .smeta{font-size:12.5px;color:var(--mut)}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-size:14px}
.st.done{background:var(--pri);border-color:var(--pri);color:#fff}
.st.missed{border-color:#e7b9b3;color:var(--bad);background:var(--bad-bg)}
.st.today{border-color:var(--pri);color:var(--pri)}
.st.rest{border:0;background:none}
.adj{font-size:11px;font-weight:600;color:var(--warn);margin-left:4px}
/* plan */
details.week{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.week>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.week>summary::-webkit-details-marker{display:none}
details.week[open]>summary{border-bottom:1px solid var(--line);background:var(--soft2)}
.chev{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--soft2);color:var(--pri-d);text-align:center;line-height:22px;font-size:12px;transition:transform .2s;margin-left:6px;vertical-align:middle}
details.week[open] .chev{transform:rotate(180deg)}
.wprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wprev span{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--soft2);color:var(--mut);white-space:nowrap}
.wprev span b{color:var(--ink);font-weight:600}
details.week[open] .wprev{display:none}
.wbody{padding:4px 14px 12px}
.wk{font-weight:700}
.group{margin:22px 0 10px;padding:12px 14px;border-radius:14px;background:#f9e9ef;color:#7a2448;display:flex;justify-content:space-between;align-items:center;gap:8px}
.group b{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* lists */
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.del{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:4px}
.linkbtn{background:none;border:0;color:var(--pri-d);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0}
/* charts */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:12px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bplan{position:absolute;bottom:0;left:0;right:0;border:1.5px dashed #b9d8c0;border-bottom:0;border-radius:6px 6px 0 0}
.bact{position:relative;width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.bcol.cur .bact{background:#9ad94a}
.blabels{display:flex;gap:5px;margin-top:4px}
.blabels span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.vo2{display:flex;align-items:flex-end;gap:14px}
.vo2 .big{font-size:48px;color:var(--pri-d)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft2);color:var(--mut);flex:none}
.rank.r1{background:#fbe7a6;color:#7a5a00} .rank.r2{background:#e6eaee;color:#4a5560} .rank.r3{background:#f3d9c4;color:#7a4316}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn.ghost{background:var(--soft);color:var(--pri-d)} .btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)} .btn.danger{background:#fff;border:1px solid #efc9c4;color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btns{display:grid;gap:10px;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;border-radius:999px;padding:13px 18px;box-shadow:0 8px 20px rgba(42,114,67,.28)}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{color:var(--pri-d);font-weight:700}
.tabs svg{width:22px;height:22px}
/* sheet + forms */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,40,26,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.panel{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
label.f{display:block;font-size:13px;color:var(--mut);font-weight:500;margin-bottom:12px}
label.f input:not([type=checkbox]):not([type=radio]):not([type=range]),label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);font-size:16px;color:var(--ink);min-height:46px}
label.f textarea{min-height:64px;resize:vertical}
.flabel{font-size:13px;color:var(--mut);font-weight:500;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--pri);margin-top:6px}
.inline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-bottom:12px}
.inline input{width:20px;height:20px;accent-color:var(--pri)}
.hint{font-size:12.5px;color:var(--pri-d);margin:-6px 0 12px;font-weight:500}
details.more{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--pri-d)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;min-width:40px;text-align:center;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--mut)}
.chips input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg label,.seg button{cursor:pointer;background:none;border:0;padding:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:7px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg input:checked+span,.seg button.on span{background:#fff;color:var(--pri-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tpl{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 4px}
.tpl button{flex:none;border:1px solid var(--line);background:var(--soft2);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--pri-d);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.shoe{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;cursor:pointer}
.shoe .sw{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.shoe.retired{opacity:.55}
.swc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:0}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ins:first-child{border-top:0}
.ins i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--pri);margin-top:1px}
.ins.warn i{background:#e0a33a} .ins.bad i{background:var(--bad)} .ins.info i{background:#5b7fb8} .ins.gold i{background:var(--gold)}
.celebrate{text-align:center;padding:6px 0 10px}
.install{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#0d5a3c,#1f7a52);color:#fff;border:0}
.install img{width:46px;height:46px;border-radius:12px;flex:none;background:#fff}
.install .x{background:none;border:0;color:#cfe9da;font-size:20px;padding:4px 6px;cursor:pointer;line-height:1}
.install .btn{background:#b6ef5a;color:#0d3d28;padding:8px 14px}
.steps{counter-reset:s;margin:4px 0 14px;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:var(--soft2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.kbd svg{width:16px;height:16px}
.celebrate .mid{color:var(--pri-d)}
@media (max-width:380px){.big{font-size:36px}.mid{font-size:22px}.tabs button{font-size:10px}.grid4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">
    <div style="min-width:0"><img id="wordmark" alt="KAOWIN" style="height:28px;display:block"><div class="tagline">ก้าววิน · Every Step Wins.</div></div>
  </div>
  <div class="hdr-r"><button class="who" data-act="profiles" id="who"></button><span class="chip" id="countdown"></span></div>
</div></header>

<main id="view"></main>
<footer class="foot"><div class="foot-in"><b>© 2026 ก้าววิน · Every Step Wins.</b><span>ปรุงยาเภสัช สงวนลิขสิทธิ์</span></div></footer>

<button class="btn fab" data-act="openLog" id="fab">＋ ส่งผลซ้อม</button>

<nav class="tabs"><div class="tabs-in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ภาพรวม</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>ตาราง</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>สถิติ</button>
  <button data-tab="challenge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>ชาเลนจ์</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>ฉัน</button>
</div></nav>

<div class="sheet hidden" id="sheet"><div class="panel">
  <div class="grab"></div>
  <div class="row" style="margin-bottom:12px"><h3 style="margin:0" id="sheetTitle"></h3><button class="del" data-act="closeSheet">ปิด</button></div>
  <div id="sheetBody"></div>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
/* =====================================================================
   ค่าที่แก้ได้ง่าย ๆ (ข้อมูลนักวิ่ง/รองเท้า/รายการแข่ง/PB กรอกในแอปได้เลย)
   ===================================================================== */
const APP_NAME = "KAOWIN";
const APP_TAGLINE = "ก้าววิน Every Step Wins.";

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const ds = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const dow = s => (parseDate(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dow(s));
const thDate = s => { const d = parseDate(s); return d.getDate() + " " + TH_MON[d.getMonth()]; };
const thDateY = s => { const d = parseDate(s); return thDate(s) + " " + String(d.getFullYear() + 543).slice(2); };
const TODAY = ds(new Date());
const uid = () => Math.random().toString(36).slice(2, 9);
function toSec(t) { if (!t) return 0; const p = String(t).replace(/\s/g, "").split(":").map(Number); if (!p.length || p.some(isNaN)) return 0; return p.reduce((a, v) => a * 60 + v, 0); }
function fmtTime(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
function fmtDur(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} ชม. ${m} น.` : `${m} นาที`; }
const fmtPace = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const rng = a => a ? fmtPace(a[0]) + "–" + fmtPace(a[1]) : "";
// อ่านเวลาที่ผู้ใช้พิมพ์แบบยืดหยุ่น: "1:50" (ชม.:นาที หรือ นาที:วินาที เลือกตามเพซที่สมเหตุสมผล), "1.50", "1 50", "110" (นาที), "1:49:59"
const PACE_OK = s => s >= 150 && s <= 1200;                      // 2:30–20:00 นาที/กม.
function normDur(str) { return String(str || "").trim().replace(/[.,;\s]+|ชม\.?|ชั่วโมง|h/gi, ":").replace(/[^0-9:]/g, "").replace(/:+/g, ":").replace(/^:|:$/g, ""); }
function parseDuration(str, km) {
  const s = normDur(str); if (!s) return 0;
  const p = s.split(":").map(Number); if (p.some(isNaN)) return 0;
  if (p.length >= 3) return p[0] * 3600 + p[1] * 60 + p[2];
  if (p.length === 2) {
    const ms = p[0] * 60 + p[1], hm = p[0] * 3600 + p[1] * 60;
    if (!km) return ms;
    if (PACE_OK(ms / km)) return ms;
    if (PACE_OK(hm / km)) return hm;
    return ms;
  }
  const n = p[0];                                                 // ตัวเลขล้วน = นาที
  return n * 60;
}
function parsePace(str) {
  const s = normDur(str); if (!s) return 0;
  const p = s.split(":").map(Number); if (p.some(isNaN)) return 0;
  if (p.length === 2) return p[0] * 60 + p[1];
  if (p.length === 1) { const n = p[0]; if (n >= 100) return Math.floor(n / 100) * 60 + n % 100; return n * 60; }   // "513" = 5:13, "5" = 5:00
  return 0;
}
const durTH = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return [h ? h + " ชม." : "", m ? m + " นาที" : "", x ? x + " วิ" : ""].filter(Boolean).join(" ") || "0 วิ"; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtKm = n => (Math.round(n * 10) / 10).toLocaleString("th-TH");
const r05 = x => Math.max(0, Math.round(x * 2) / 2);
const cat = km => km <= 5.5 ? "5" : km <= 10.5 ? "10" : km <= 22 ? "half" : "full";
const distLabel = km => { const o = DISTS.find(o => Math.abs(o.km - km) < 0.05); return o ? o.label : fmtKm(km) + " กม."; };
const sameDist = (a, b) => Math.abs(a - b) / b < 0.03;
const $ = s => document.querySelector(s);

const sumKm = (logs, from, to) => logs.filter(l => (!from || l.date >= from) && (!to || l.date <= to)).reduce((t, l) => t + (+l.km || 0), 0);

/* ---------- VO2max (VDOT ของ Jack Daniels) ---------- */
function vdot(km, sec) {
  const t = sec / 60, v = km * 1000 / t; if (!(t > 3 && km > 0)) return 0;
  const vo2 = -4.6 + 0.182258 * v + 0.000104 * v * v;
  const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
  return vo2 / pct;
}
function vdotTime(V, km) { let lo = km * 90, hi = km * 1200; for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (vdot(km, mid) > V) lo = mid; else hi = mid; } return (lo + hi) / 2; }
const vdotBand = v => v >= 60 ? "ระดับแข่งขัน" : v >= 50 ? "ดีมาก" : v >= 42 ? "ดี" : v >= 35 ? "ปานกลาง" : "เริ่มต้น";

function newProfile(name) {

    pbs: [], planStart: mondayOf(TODAY), runDays: [2, 5, 6], longDay: 6, gymDays: [0, 3],
    shoes: [], races: [], logs: [], overrides: {} };
}
function seed() {
  const p = newProfile("");
  p.onboarded = false;
  return { active: p.id, profiles: [p], challenges: [] };
}
function migrate(db) {
  db.profiles.forEach(p => {
    if (!Array.isArray(p.pbs)) p.pbs = [];
    if (p.onboarded === undefined) p.onboarded = true;
    delete p.recent; p.logs = p.logs || []; p.overrides = p.overrides || {}; p.shoes = p.shoes || []; p.races = p.races || [];
  });
  if (!Array.isArray(db.challenges)) db.challenges = [];
  return db;
}
let DB = migrate((() => { try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && Array.isArray(d.profiles) && d.profiles.length) return d; } catch (e) {} return seed(); })());
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {} }
const P = () => DB.profiles.find(p => p.id === DB.active) || DB.profiles[0];
const shoeById = id => P().shoes.find(s => s.id === id);
const shoeName = s => s ? `${s.brand} ${s.model}`.trim() : "";
const shoeShort = s => s ? s.model || s.brand : "";
const shoeColor = s => SHOE_USES[shoeUses(s)[0]].color;
const usesLabel = s => shoeUses(s).map(u => SHOE_USES[u].label).join(" · ");
const shoeUsed = (p, sh) => (+sh.startKm || 0) + p.logs.filter(l => l.shoe === sh.id).reduce((t, l) => t + (+l.km || 0), 0);
const sortedRaces = p => p.races.filter(r => r.date && r.km && r.target).sort((a, b) => a.date.localeCompare(b.date));
const nextRace = p => sortedRaces(p).find(r => r.date >= TODAY);

/* ---------- paces ---------- */
function racePaces(r) {
  const T = r.target, D = r.km, at = d => T * Math.pow(d / D, 1.06) / d;
  const R = T / D, H = at(21.0975), P5 = at(5), P10 = at(10);
  return { R, ranges: { recovery: [H + 75, H + 105], easy: [H + 45, H + 85], long: [H + 40, H + 80], steady: [H + 15, H + 30],
    tempo: [H - 4, H + 4], p10: [P10 - 3, P10 + 3], p5: [P5 - 4, P5 + 3], fast: [P5 - 10, P5 - 3], race: [R - 3, R + 3] } };
}

/* ---------- ความสำคัญของงานแข่ง ---------- */
// A = งานหลัก (ตารางวางรอบงานนี้) · B = งานรอง/ซ้อมแข่ง (ลดโหลดสั้น ๆ) · C = วิ่งสนุก (ไม่ปรับตาราง)
const PRIO = {
  A: { icon: "🏆", label: "งานหลัก", desc: "ตารางวางรอบงานนี้ มีช่วงลดระยะและพักฟื้นเต็ม" },
  B: { icon: "🎯", label: "งานรอง / ซ้อมแข่ง", desc: "ลดโหลด 2–3 วันก่อนแข่ง ใช้แทนวันซ้อมเร็ว แล้วกลับเข้าแผนงานหลัก" },
  C: { icon: "🙂", label: "วิ่งสนุก", desc: "ไม่ปรับตาราง ใช้แทน Easy หรือ Long Run วันนั้น" }
};
function prioOf(p, r) {
  if (r.prio) return r.prio;
  // ไม่ได้ตั้ง: งานที่ระยะไกลที่สุด (ถ้าเท่ากันเอางานหลังสุด) เป็นงานหลัก นอกนั้นเป็นงานรอง
  const rs = sortedRaces(p).filter(x => !x.prio); if (!rs.length) return "A";
  const main = rs.reduce((a, b) => (b.km > a.km + 0.05 || (Math.abs(b.km - a.km) <= 0.05 && b.date >= a.date)) ? b : a);
  return main.id === r.id ? "A" : "B";
}
const mainRace = p => sortedRaces(p).find(r => r.date >= TODAY && prioOf(p, r) === "A") || nextRace(p);

/* ---------- สร้างตารางอัตโนมัติจากรายการแข่ง ---------- */
function generate(p) {
  const races = sortedRaces(p); if (!races.length) return [];
  let mains = races.filter(r => prioOf(p, r) === "A");
  if (!mains.length) mains = [races[races.length - 1]];
  const side = races.filter(r => !mains.includes(r));
  const start = mondayOf(p.planStart || TODAY), end = mondayOf(races[races.length - 1].date);
  if (start > end) return [];
  const lvl = { beginner: 0, intermediate: 1, advanced: 2 }[p.level] ?? 1;
  const days = [...new Set((p.runDays || []).map(Number))].sort((a, b) => a - b);
  if (!days.length) return [];
  const longDay = days.includes(+p.longDay) ? +p.longDay : days[days.length - 1];
  let vol = Math.max(8, +p.weeklyKm || 15), sinceDeload = 0; const rot = {}; const out = []; SHOE_ROT = {};

  for (let ws = start, i = 0; ws <= end; ws = addDays(ws, 7), i++) {
    const we = addDays(ws, 6);
    // งานหลักถัดไป (ถ้าไม่มีแล้ว ใช้งานใดก็ได้ที่เหลือเป็นเป้าของช่วงนั้น)
    const race = mains.find(r => r.date >= ws) || races.find(r => r.date >= ws), c = cat(race.km);
    const prevMain = [...mains].reverse().find(r => r.date < ws);
    const sideHere = side.filter(r => r.date >= ws && r.date <= we && r !== race);
    const bHere = sideHere.find(r => prioOf(p, r) === "B");
    const bPrev = side.find(r => prioOf(p, r) === "B" && r.date < ws && r.date >= addDays(ws, -4));   // แข่งงานรองปลายสัปดาห์ก่อน
    const wtr = Math.round(diffDays(ws, mondayOf(race.date)) / 7), peak = PEAK_KM[c][lvl];
    let phase;
    if (wtr === 0) phase = "race";
    else if (prevMain && diffDays(prevMain.date, ws) < REC_DAYS[cat(prevMain.km)]) phase = "recovery";
    else if (wtr < TAPER_WK[c]) phase = "taper";
    else if (wtr <= TAPER_WK[c] + 3) phase = "specific";
    else if (wtr <= TAPER_WK[c] + 7) phase = "build";
    else phase = "base";

    let target, deload = false;
    if (phase === "race") target = vol * 0.4;
    else if (phase === "taper") target = vol * (wtr === 1 ? 0.6 : 0.75);
    else if (phase === "recovery") target = vol * 0.55;
    else {
      sinceDeload++;
      // ลดโหลดทุก ~4 สัปดาห์ แต่ไม่ให้ตกช่วงใกล้งานหลัก (ช่วงลดระยะทำหน้าที่แทน) และไม่ซ้อนสัปดาห์ที่มีงานรอง
      const canDeload = wtr > TAPER_WK[c] + 2 && !bHere && !bPrev;
      if (sinceDeload >= 4 && canDeload) { deload = true; sinceDeload = 0; target = vol * 0.8; }
      else { if (vol < peak) vol = Math.min(peak, vol * WEEKLY_GROWTH); target = vol; }
    }
    if (bHere && phase !== "race") target *= 0.85;
    if (bPrev && phase !== "race" && phase !== "recovery") target *= cat(bPrev.km) === "half" || cat(bPrev.km) === "full" ? 0.8 : 0.9;

    const pc = racePaces(race);
    const wk = { i, n: i + 1, start: ws, end: we, phase, race, deload, pc, side: sideHere, sessions: [] };
    let qN = { base: 1, build: days.length >= 5 ? 2 : 1, specific: days.length >= 5 ? 2 : 1, taper: 1, race: 0, recovery: 0 }[phase];
    if (deload) qN = Math.min(qN, 1);
    if (days.length <= 2) qN = Math.min(qN, 1);
    if (bHere) qN = Math.max(0, qN - 1);                       // งานรองนับเป็นวันเร็วแล้ว
    if (bPrev) qN = Math.max(0, qN - 1);
    const pool0 = days.filter(d => d !== longDay && Math.abs(d - longDay) > 1);
    const pool = pool0.length ? pool0 : days.filter(d => d !== longDay);
    const qDays = []; pool.forEach(d => { if (qDays.length < qN && qDays.every(x => Math.abs(x - d) >= 2)) qDays.push(d); });

    const L = phase === "race" ? 0 : Math.min(LONG_CAP[c], phase === "recovery" ? 8 : 99, Math.max(5, target * ({ 2: .5, 3: .4, 4: .35, 5: .3, 6: .27, 7: .25 }[days.length] || .3)));

function renderPlan() {

function renderStats() {
  const p = P(), runs = runLogs(p), fit = fitness(p);
  let vo2 = `<div class="mut small">ยังไม่มีค่า — ใส่ค่าจากนาฬิกา (Garmin, COROS ฯลฯ) หรือใส่ PB / ส่งผลซ้อมที่มีช่วงเร็ว ≥ 2 กม. เพื่อให้แอปคำนวณ</div>`;
  if (fit) {
    const mlog = [...(p.vo2log || [])].sort((a, b) => a.date.localeCompare(b.date));
    const pts = mlog.length >= 2 ? mlog.map(m => ({ v: +m.value, date: m.date })) : fit.efforts.filter(e => e.date).sort((a, b) => a.date.localeCompare(b.date));
    let spark = "";
    if (pts.length >= 2) {
      const vs = pts.map(e => e.v), mn = Math.min(...vs) - 1, mx = Math.max(...vs) + 1;
      const xy = pts.map((e, i) => [i / (pts.length - 1) * 280 + 10, 60 - (e.v - mn) / (mx - mn) * 50]);
      spark = `<svg viewBox="0 0 300 70" style="width:100%;height:70px;margin-top:8px"><polyline fill="none" stroke="#3d9a5b" stroke-width="2.5" stroke-linejoin="round" points="${xy.map(a => a.join(",")).join(" ")}"/>${xy.map(a => `<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="#fff" stroke="#3d9a5b" stroke-width="2"/>`).join("")}</svg><div class="tiny mut">${mlog.length >= 2 ? "แนวโน้มจากค่าที่ใส่เอง" : "แนวโน้มจากผลที่มีวันที่"}</div>`;
    }
    const gap = fit.longest && fit.longest.km >= 15 ? fit.v - fit.longest.v : 0;
    vo2 = `<div class="vo2"><div class="big">${fit.v.toFixed(1)}</div><div style="padding-bottom:6px"><span class="chip">${vdotBand(fit.v)}</span><div class="tiny mut" style="margin-top:4px">มล./กก./นาที · ${fit.manual ? esc(fit.best.label) : "ประมาณจาก " + esc(fit.best.label)}</div></div></div>
      ${fit.manual && fit.calcV ? `<div class="tiny mut">คำนวณจากผลวิ่งได้ ${fit.calcV.toFixed(1)}${Math.abs(fit.calcV - fit.v) >= 4 ? " — ต่างจากนาฬิกาค่อนข้างมาก ตารางเพซใช้เป้าแข่งเป็นหลักอยู่แล้ว" : ""}</div>` : ""}
      ${spark}
      ${gap > 3 ? `<div class="note warn">ความเร็วนำความทนทาน: ${esc(fit.longest.label)} เทียบได้ VO2max แค่ ${fit.longest.v.toFixed(1)} ต่ำกว่าค่าดีสุด ${gap.toFixed(1)} — เน้น Long Run, ซ้อมเติมพลังงาน และเพซแข่งช่วงท้าย</div>` : ""}
      <table style="margin-top:10px"><tr><th>เวลาที่ทำได้ตามศักยภาพ</th><th class="num">เวลา</th><th class="num">เพซ</th></tr>
      ${DISTS.map(d => { const t = vdotTime(fit.v, d.km); return `<tr><td>${d.label}</td><td class="num">${fmtTime(t)}</td><td class="num">${fmtPace(t / d.km)}</td></tr>`; }).join("")}</table>
      <div class="tiny mut" style="margin-top:6px">${fit.manual ? "เวลาคำนวณจากค่า VO2max ที่ใส่ (สูตร VDOT)" : "ค่าประมาณจากผลวิ่ง (สูตร VDOT) ไม่ใช่ผลวัดในแล็บ"} ระยะไกลต้องมีความทนทานรองรับด้วย</div>`;
  }
  vo2 += `<div class="row" style="margin-top:12px;gap:8px"><button class="btn ghost sm" data-act="vo2Form">⌚ ใส่ค่าจากนาฬิกา</button>${(p.vo2log || []).length ? `<button class="linkbtn" data-act="vo2List">ประวัติ (${p.vo2log.length})</button>` : ""}</div>`;
  const pbs = [...(p.pbs || [])].sort((a, b) => a.km - b.km);
  const pbHtml = pbs.length ? pbs.map(b => `<div class="item" data-act="pbForm" data-id="${b.id}"><span class="chip gold">${esc(distLabel(+b.km))}</span><div class="grow"><b>${fmtTime(b.time)}</b> <span class="small mut">· ${fmtPace(b.time / b.km)}/กม.</span><div class="tiny mut">${b.date ? thDateY(b.date) : "ไม่ระบุวันที่"}${b.name ? " · " + esc(b.name) : ""}</div></div><span class="small mut">VO2 ${vdot(+b.km, +b.time).toFixed(1)}</span></div>`).join("") : `<div class="mut small">ยังไม่มี PB</div>`;
  const wkStart = mondayOf(TODAY), mStart = TODAY.slice(0, 8) + "01", yStart = TODAY.slice(0, 5) + "01-01";
  const weeks = []; for (let k = 11; k >= 0; k--) {
    const ws = addDays(wkStart, -7 * k), we = addDays(ws, 6);
    const plan = allSessions().filter(s => s.date >= ws && s.date <= we && RUN_TYPES.includes(s.type)).reduce((t, s) => t + (view(s).km || 0), 0);
    weeks.push({ ws, act: sumKm(runs, ws, we), plan, cur: k === 0 });
  }
  const mx = Math.max(10, ...weeks.map(w => Math.max(w.act, w.plan)));
  const bars = `<div class="bars">${weeks.map(w => `<div class="bcol ${w.cur ? "cur" : ""}" title="${thDate(w.ws)}: ${fmtKm(w.act)} กม.">${w.plan ? `<div class="bplan" style="height:${w.plan / mx * 100}%"></div>` : ""}<div class="bact" style="height:${w.act / mx * 100}%"></div></div>`).join("")}</div>
    <div class="blabels">${weeks.map((w, i) => `<span>${i % 2 === 1 || w.cur ? parseDate(w.ws).getDate() + "/" + (parseDate(w.ws).getMonth() + 1) : ""}</span>`).join("")}</div>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--pri)"></i>วิ่งจริง</span><span><i style="border:1.5px dashed #9cc9a8;background:none"></i>ตามแผน</span></div>`;
  const months = []; for (let k = 5; k >= 0; k--) { const d = parseDate(mStart); d.setMonth(d.getMonth() - k); const s = ds(d); const e = new Date(d); e.setMonth(e.getMonth() + 1); e.setDate(0); months.push({ s, km: sumKm(runs, s, ds(e)) }); }
  const r30 = runs.filter(l => l.date >= addDays(TODAY, -29) && l.date <= TODAY);
  const tSec = r30.reduce((t, l) => t + toSec(l.time), 0), kmT = r30.filter(l => toSec(l.time)).reduce((t, l) => t + (+l.km || 0), 0);
  const byType = RUN_TYPES.map(t => ({ t, km: sumKm(r30.filter(l => l.type === t)) })), tot = byType.reduce((a, b) => a + b.km, 0);
  let streak = 0; for (let i = W.length - 1; i >= 0; i--) { const w = W[i]; if (w.end >= TODAY) continue; const pl = w.sessions.filter(s => RUN_TYPES.includes(s.type)).reduce((t, s) => t + (view(s).km || 0), 0); if (pl && sumKm(runs, w.start, w.end) >= pl * 0.8) streak++; else break; }

function chValue(ch, p) {
  const L = runLogs(p).filter(l => l.date >= ch.start && l.date <= ch.end);
  if (ch.type === "runs") return L.length;
  if (ch.type === "days") return new Set(L.map(l => l.date)).size;
  if (ch.type === "longest") return L.reduce((m, l) => Math.max(m, +l.km || 0), 0);
  return sumKm(L);
}
function chBoard(ch) {
  const rows = (ch.members || []).map(id => DB.profiles.find(p => p.id === id)).filter(Boolean).map(p => ({ name: p.name, value: chValue(ch, p), me: p.id === DB.active }))
    .concat((ch.guests || []).map(g => ({ name: g.name, value: +g.value || 0, guest: true })));
  return rows.sort((a, b) => b.value - a.value);
}
const chFmt = (ch, v) => ch.type === "runs" || ch.type === "days" ? String(v) : fmtKm(v);

function copyText(t) {

function pickPhoto() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const S = 256, c = document.createElement("canvas"); c.width = c.height = S;
      const k = Math.min(img.width, img.height), x = (img.width - k) / 2, y = (img.height - k) / 2;   // ครอปกลางเป็นสี่เหลี่ยม
      c.getContext("2d").drawImage(img, x, y, k, k, 0, 0, S, S);
      P().photo = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url); save(); render(); toast("อัปเดตรูปแล้ว");
    };
    img.onerror = () => toast("เปิดรูปนี้ไม่ได้");
    img.src = url;
  };
  inp.click();
}

    : `<div class="mut small">ยังไม่มีรายการแข่ง</div>`}</div>

  <div class="card" style="text-align:center;padding:14px"><img src="${LOGO_WORDMARK}" alt="KAOWIN" style="height:30px">${sloganHtml()}</div>

      ${isStandalone() ? `<div class="note" style="margin:0">✓ ติดตั้งเป็นแอปแล้ว · ใช้งานออฟไลน์ได้</div>` : `<button class="btn" data-act="install">📲 ติดตั้งแอปลงหน้าจอโฮม</button>`}

      <div class="grid2"><button class="btn line" data-act="export">Export</button><button class="btn line" data-act="import">Import</button></div>
      <button class="btn danger" data-act="delProfile">ลบนักวิ่ง “${esc(p.name)}”</button>

}
function renderShoes() {
  const p = P(), upcoming = allSessions().filter(s => s.date >= TODAY && RUN_TYPES.includes(s.type) && status(s) !== "done");
  const cards = p.shoes.length ? [...p.shoes].sort((a, b) => !!a.retired - !!b.retired).map(sh => {
    const used = shoeUsed(p, sh), plan = upcoming.filter(s => s.shoe === sh.id).reduce((t, s) => t + (view(s).km || 0), 0);
    const pct = Math.min(100, used / (+sh.maxKm || 600) * 100), cls = pct > 90 ? "bad" : pct > 75 ? "warn" : "";
    return `<div class="card shoe ${sh.retired ? "retired" : ""}" data-act="shoeForm" data-id="${sh.id}">
      <div class="sw" style="background:${shoeColor(sh)}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16c0-3 1-7 2-9l4 3c2 1 4 1 6 2l4 1c1 .3 2 1.3 2 2.5V18H4a1 1 0 0 1-1-1z"/><path d="M3 18h18"/></svg></div>
      <div><div class="row"><b>${esc(shoeName(sh))}</b><span class="tiny mut">แก้ไข ›</span></div>
        <span class="chip ${sh.retired ? "gray" : ""}" style="margin:4px 0 2px">${sh.retired ? "ปลดระวางแล้ว" : esc(usesLabel(sh))}</span>
        <div class="row small" style="margin-top:8px"><span>ใช้ไป <b>${fmtKm(used)}</b> / ${sh.maxKm} กม.</span>${sh.retired ? "" : `<span class="mut">ตามแผนอีก ${fmtKm(plan)}</span>`}</div>
        <div class="bar ${cls}"><i style="width:${pct}%"></i></div></div></div>`;
  }).join("") : `<div class="card empty"><div class="mid">ยังไม่มีรองเท้า</div><p>เพิ่มรองเท้าที่มี แล้วแอปจะเลือกคู่ให้แต่ละนัดซ้อม</p></div>`;
  const soon = upcoming.slice(0, 8).map(s => { const sh = shoeById(s.shoe), v = view(s); return `<tr><td>${TH_DAY[s.day]} ${thDate(s.date)}</td><td><span class="tag t-${v.type}">${TYPE_LABEL[v.type]}</span>${fmtKm(v.km)} กม.<div class="tiny mut">${SHOE_USES[sessionUse(s, W[s.wi] ? W[s.wi].phase : "")].label}</div></td><td>${sh ? `<span class="swc" style="background:${shoeColor(sh)}"></span>${esc(shoeShort(sh))}` : '<span class="mut">ยังไม่ได้เลือก</span>'}</td></tr>`; }).join("");
  return `<div class="row" style="margin:4px 0 10px"><h2 style="margin:0">รองเท้า</h2><button class="btn ghost sm" data-act="shoeForm">＋ เพิ่มรองเท้า</button></div>${cards}
    ${soon ? `<h2>นัดถัดไปใส่คู่ไหน</h2><div class="card"><table><tr><th>วัน</th><th>นัด</th><th>รองเท้า</th></tr>${soon}</table>
    <div class="tiny mut" style="margin-top:8px">แอปจับคู่ตามที่ติ๊ก “ใช้สำหรับ” ของแต่ละคู่ ถ้าหลายคู่ใช้งานเดียวกันจะสลับให้คู่ที่สึกน้อยกว่า · เปลี่ยนรายนัดได้โดยแตะนัดแล้วกด “แก้นัดนี้”</div></div>` : ""}`;
}

/* ---------- sheets ---------- */
function openSheet(title, html, mount) { $("#sheetTitle").textContent = title; $("#sheetBody").innerHTML = html; $("#sheet").classList.remove("hidden"); $(".panel").scrollTop = 0; if (mount) mount($("#sheetBody")); }
const closeSheet = () => $("#sheet").classList.add("hidden");

function openSession(key) {
  const s = allSessions().find(x => x.key === key); if (!s) return;
  const v = view(s), sh = shoeById(s.shoe), logs = logsFor(s);
  openSheet(`${TH_DAY_FULL[s.day]} ${thDateY(s.date)}`, `
    <div class="sdesc" style="font-size:16px"><span class="tag t-${v.type}">${TYPE_LABEL[v.type]}</span>${esc(v.detail)}</div>
    <table style="margin:10px 0 14px">
      ${v.km ? `<tr><td class="mut">ระยะ</td><td class="num">${fmtKm(v.km)} กม.</td></tr>` : ""}
      ${v.pace ? `<tr><td class="mut">เพซ</td><td class="num">${v.pace} /กม.</td></tr>` : ""}
      ${RUN_TYPES.includes(s.type) ? `<tr><td class="mut">รองเท้า</td><td class="num">${sh ? esc(shoeName(sh)) : "ยังไม่ได้เลือก"}</td></tr>` : ""}
    </table>
    ${logs.length ? `<div class="flabel">ผลที่ส่งแล้ว</div><div class="card" style="padding:4px 14px">${logs.map(l => `<div class="item" data-act="analysis" data-id="${l.id}"><div class="grow small">${fmtKm(+l.km)} กม. ${esc(l.time)} · RPE ${l.rpe}</div><span class="linkbtn">ดูวิเคราะห์ ›</span></div>`).join("")}</div>` : ""}
    <div class="btns">
      ${s.type !== "rest" ? `<button class="btn" data-act="openLog" data-key="${s.key}">ส่งผลซ้อม</button>` : ""}
      ${s.type !== "gym" ? `<button class="btn ghost" data-act="editSession" data-key="${s.key}">แก้นัดนี้</button>` : ""}
      ${s.edited ? `<button class="btn line" data-act="resetSession" data-date="${s.date}">คืนค่าตามแผนเดิม</button>` : ""}
    </div>`);
}

function editSession(key) {
  const s = allSessions().find(x => x.key === key); if (!s) return;
  const p = P(), shoes = p.shoes.filter(x => !x.retired || x.id === s.shoe);
  openSheet("แก้นัดซ้อม · " + thDate(s.date), `<form id="edForm">
    <div class="grid2">
      <label class="f">ประเภท<select name="type">${["easy", "long", "quality", "rest"].map(t => `<option value="${t}" ${s.type === t ? "selected" : ""}>${TYPE_LABEL[t]}</option>`).join("")}</select></label>
      <label class="f">ระยะ (กม.)<input name="km" inputmode="decimal" value="${s.km || ""}"></label>
    </div>
    <label class="f">รายละเอียด<input name="detail" value="${esc(s.detail)}"></label>
    <div class="grid2">
      <label class="f">เพซ<select name="pace">${PACE_KEYS.map(([k, l]) => `<option value="${k}" ${s.pace === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f">รองเท้า<select name="shoe"><option value="">—</option>${shoes.map(x => `<option value="${x.id}" ${s.shoe === x.id ? "selected" : ""}>${esc(shoeShort(x))}</option>`).join("")}</select></label>
    </div>
    <button class="btn block" type="submit">บันทึก</button></form>`, body => {
    body.querySelector("#edForm").addEventListener("submit", e => {
      e.preventDefault(); const F = e.target.elements;
      p.overrides[s.date] = F.type.value === "rest" ? { type: "rest" } : { type: F.type.value, km: r05(parseFloat(F.km.value) || 0), detail: F.detail.value.trim() || TYPE_LABEL[F.type.value], pace: F.pace.value, shoe: F.shoe.value };
      save(); closeSheet(); render(); toast("แก้นัดแล้ว");
    });
  });
}

function openLog(key) {
  const p = P();
  const shoeOpts = `<option value="">—</option>` + p.shoes.filter(x => !x.retired).map(x => `<option value="${x.id}">${esc(shoeShort(x))}</option>`).join("");
  openSheet("ส่งผลซ้อม", `<form id="logForm" autocomplete="off">
    <label class="f">วันที่<input type="date" name="date" required></label>
    <label class="f">ตรงกับนัดซ้อมไหน<select name="sessionKey"></select></label>
    <div class="grid2">
      <label class="f">ประเภท<select name="type">${["easy", "long", "quality", "race", "gym"].map(t => `<option value="${t}">${TYPE_LABEL[t]}</option>`).join("")}</select></label>
      <label class="f">รองเท้า<select name="shoe">${shoeOpts}</select></label>
      <label class="f">ระยะรวม (กม.)<input name="km" inputmode="decimal" placeholder="8"></label>
      <label class="f">เวลารวม<input name="time" inputmode="decimal" placeholder="48:30"></label>
    </div>
    <details class="more"><summary>ช่วงเร็วต่อเนื่อง (ใช้วิเคราะห์และคำนวณ VO2max)</summary>
      <p class="tiny mut" style="margin:6px 0 10px">ใส่ท่อนที่วิ่งต่อเนื่อง ≥ 2 กม. เช่น Tempo 4 กม. หรือ 1 ท่อนของ 3×2 กม.</p>
      <div class="grid2"><label class="f">ระยะ (กม.)<input name="segKm" inputmode="decimal" placeholder="2"></label><label class="f">เวลา<input name="segTime" inputmode="decimal" placeholder="10:30"></label></div>
    </details>
    <label class="f">ความเหนื่อย (RPE 1–10): <b class="rpeOut">5</b><input type="range" min="1" max="10" name="rpe" value="5"></label>
    <label class="inline"><input type="checkbox" name="pain" style="accent-color:var(--bad)"> มีอาการเจ็บ / ตึงผิดปกติ</label>
    <label class="f">โน้ต (ตะคริว เจล น้ำ อากาศ ฯลฯ)<textarea name="note"></textarea></label>
    <button class="btn block" type="submit">บันทึกและวิเคราะห์</button></form>`, body => {
    const form = body.querySelector("#logForm"), F = form.elements;
    const fill = (date, prefer) => {
      const w = W.find(x => x.start <= date && date <= x.end), opts = w ? w.sessions.filter(s => s.type !== "rest") : [];
      F.sessionKey.innerHTML = `<option value="">นอกตาราง / วิ่งเพิ่ม</option>` + opts.map(s => `<option value="${s.key}">${TH_DAY[s.day]} ${thDate(s.date)} · ${TYPE_LABEL[view(s).type]} ${esc(view(s).detail)}</option>`).join("");
      const m = prefer ? opts.find(s => s.key === prefer) : opts.find(s => s.date === date && s.type !== "gym" && !logsFor(s).length) || opts.find(s => s.date === date);
      F.sessionKey.value = m ? m.key : ""; apply();
    };
    const apply = () => { const s = allSessions().find(x => x.key === F.sessionKey.value); if (!s) return; const v = view(s); F.type.value = v.type; F.shoe.value = s.shoe || ""; F.km.value = v.km || ""; };
    const s0 = key && allSessions().find(x => x.key === key);
    F.date.value = s0 ? s0.date : TODAY; fill(F.date.value, key);
    F.date.addEventListener("change", () => fill(F.date.value));
    F.sessionKey.addEventListener("change", apply);
    F.rpe.addEventListener("input", () => body.querySelector(".rpeOut").textContent = F.rpe.value);
    form.addEventListener("submit", e => {
      e.preventDefault();
      const km = parseFloat(F.km.value) || 0;
      if (RUN_TYPES.includes(F.type.value) && !km) return toast("ใส่ระยะก่อนนะ");
      const tSec = F.time.value.trim() ? parseDuration(F.time.value, km) : 0, segKm = parseFloat(F.segKm.value) || 0, sSec = F.segTime.value.trim() ? parseDuration(F.segTime.value, segKm) : 0;
      if (F.time.value.trim() && (!tSec || (km && !PACE_OK(tSec / km)))) return toast("เวลารวมดูแปลก ๆ พิมพ์ เช่น 48:30 หรือ 1:52:10");
      if (F.segTime.value.trim() && (!sSec || (segKm && !PACE_OK(sSec / segKm)))) return toast("เวลาช่วงเร็วดูแปลก ๆ พิมพ์ เช่น 10:30");
      const l = { id: Date.now(), date: F.date.value, sessionKey: F.sessionKey.value || null, type: F.type.value, km, time: tSec ? fmtTime(tSec) : "",
        segKm, segTime: sSec ? fmtTime(sSec) : "", rpe: +F.rpe.value, pain: F.pain.checked, shoe: F.shoe.value, note: F.note.value.trim() };
      p.logs.push(l); save(); render();
      if (l.type === "gym") { closeSheet(); toast("บันทึกเวทแล้ว"); } else showAnalysis(l.id);
    });
  });
}

function pbForm(id) {
  const p = P(), b = id ? p.pbs.find(x => x.id === id) : null;
  const known = b && DISTS.some(d => Math.abs(d.km - b.km) < 0.05);
  openSheet(b ? "แก้ไข PB" : "เพิ่ม PB", `<form id="pbF">
    <div class="flabel">ระยะ</div>
    <div class="seg">${DISTS.map(d => `<label><input type="radio" name="dist" value="${d.km}" ${b ? (Math.abs(d.km - b.km) < 0.05 ? "checked" : "") : (d.km === 10 ? "checked" : "")}><span>${d.label.replace("Half Marathon", "Half").replace("Marathon", "Full")}</span></label>`).join("")}<label><input type="radio" name="dist" value="other" ${b && !known ? "checked" : ""}><span>อื่น ๆ</span></label></div>
    <label class="f otherKm" ${b && !known ? "" : "hidden"}>ระยะ (กม.)<input name="km" inputmode="decimal" value="${b && !known ? b.km : ""}" placeholder="4"></label>
    <label class="f">เวลา<input name="time" inputmode="decimal" value="${b ? fmtTime(b.time) : ""}" placeholder="49:05 หรือ 2:02:37" required></label>
    <div class="hint"></div>
    <div class="grid2"><label class="f">วันที่ (ถ้าจำได้)<input type="date" name="date" value="${b ? b.date || "" : ""}"></label><label class="f">รายการ<input name="name" value="${b ? esc(b.name || "") : ""}" placeholder="ไม่บังคับ"></label></div>
    <div class="btns"><button class="btn" type="submit">บันทึก</button>${b ? `<button class="btn danger" type="button" data-act="pbDel" data-id="${b.id}">ลบ PB นี้</button>` : ""}</div></form>`, body => {
    const f = body.querySelector("#pbF"), F = f.elements;
    const km = () => F.dist.value === "other" ? parseFloat(F.km.value) || 0 : +F.dist.value;
    const upd = () => { body.querySelector(".otherKm").hidden = F.dist.value !== "other"; const d = km(), t = parseDuration(F.time.value, d), hint = body.querySelector(".hint"); const bad = t && d && !PACE_OK(t / d); hint.style.color = bad ? "var(--bad)" : ""; hint.textContent = !t || !d ? "" : bad ? `อ่านได้เป็น ${durTH(t)} ดูไม่สมเหตุสมผล — พิมพ์ เช่น 49:05 หรือ 2:02:37` : `= ${durTH(t)} · เพซ ${fmtPace(t / d)}/กม. · VO2max ≈ ${vdot(d, t).toFixed(1)}`; };
    f.addEventListener("input", upd); f.addEventListener("change", upd); upd();
    f.addEventListener("submit", e => {
      e.preventDefault(); const d = km(), t = parseDuration(F.time.value, d);
      if (!d || !t) return toast("ใส่ระยะและเวลาให้ครบ");
      if (!PACE_OK(t / d)) return toast("เวลาดูไม่สมเหตุสมผล ตรวจรูปแบบอีกครั้ง");
      const data = { km: d, time: t, date: F.date.value, name: F.name.value.trim() };
      if (b) Object.assign(b, data); else p.pbs.push({ id: uid(), ...data });
      save(); closeSheet(); render(); toast("บันทึก PB แล้ว");
    });
  });
}

function shoeForm(id) {
  const p = P(), sh = id ? p.shoes.find(x => x.id === id) : null;
  const brands = Object.keys(SHOE_CATALOG), isOther = sh && !brands.includes(sh.brand);

// ตรวจความเป็นไปได้ของเป้า: เวลาเตรียมตัว + เทียบศักยภาพ
const MIN_WEEKS = { "5": [3, 6], "10": [5, 8], "half": [8, 12], "full": [12, 16] };   // [ขั้นต่ำ, แนะนำ]
const MIN_BASE  = { "5": 5, "10": 10, "half": 15, "full": 25 };                        // กม./สัปดาห์ที่ควรมีก่อนเริ่ม
function raceCheck(p, race) {
  const out = [], c = cat(race.km), wk = Math.floor(diffDays(TODAY, race.date) / 7);
  const [mn, rec] = MIN_WEEKS[c], dl = distLabel(race.km);
  if (race.date < TODAY) return out;
  const pr = race.prio || "A";
  if (pr === "C") return [{ lvl: "ok", t: "วิ่งสนุก: ไม่ปรับตาราง ใช้แทน Easy/Long ของวันนั้น วิ่งตามความรู้สึก ไม่ต้องเค้นเพซ" }];
  if (pr === "B") out.push({ lvl: "info", t: "งานรอง: ตารางงานหลักเดินต่อ ลดโหลด 2–3 วันก่อนแข่ง และฟื้นตัวสั้น ๆ หลังแข่ง ใช้ผลเช็กความฟิตได้ดี" });
  if (pr === "A" && wk < mn) out.push({ lvl: "bad", t: `เหลือ ${wk} สัปดาห์ น้อยไปสำหรับ ${dl} (ควรมีอย่างน้อย ${mn}, แนะนำ ${rec} สัปดาห์) — ตารางจะข้ามช่วงสร้างฐาน ควรตั้งเป้าแบบวิ่งให้จบสบาย ๆ` });
  else if (pr === "A" && wk < rec) out.push({ lvl: "warn", t: `เหลือ ${wk} สัปดาห์ ค่อนข้างกระชับสำหรับ ${dl} (แนะนำ ${rec} สัปดาห์) — ช่วงสร้างฐานจะสั้นกว่าปกติ ซ้อมให้ครบทุกนัดสำคัญ` });
  if (pr === "A" && (+p.weeklyKm || 0) < MIN_BASE[c] && c !== "5") out.push({ lvl: "warn", t: `ตอนนี้วิ่ง ${fmtKm(+p.weeklyKm || 0)} กม./สัปดาห์ ควรมีฐานอย่างน้อย ${MIN_BASE[c]} กม. ก่อนซ้อม ${dl} — แอปจะค่อย ๆ เพิ่มระยะให้` });
  const fit = fitness(p);
  if (fit) {
    const pot = vdotTime(fit.v, race.km);
    const gain = Math.min(0.06, Math.max(0, wk) * 0.005);       // พัฒนาได้ราว 0.5%/สัปดาห์ สูงสุด ~6%
    const reach = pot * (1 - gain), gap = pot - race.target;
    const sug = Math.ceil(reach / 30) * 30;
    if (race.target < reach * 0.985) out.push({ lvl: "bad", t: `เป้า ${fmtTime(race.target)} เร็วกว่าศักยภาพตอนนี้ (${fmtTime(pot)}) ${fmtTime(gap)} — ภายใน ${wk} สัปดาห์น่าจะทำได้ราว ${fmtTime(reach)} ลองตั้ง ${fmtTime(sug)} ก่อนไหม`, suggest: sug });
    else if (race.target < pot) out.push({ lvl: "ok", t: `เป้าท้าทายแต่เป็นไปได้: เร็วกว่าศักยภาพตอนนี้ ${fmtTime(gap)} ถ้าซ้อมตามแผน ${wk} สัปดาห์` });
    else out.push({ lvl: "ok", t: `เป้าอยู่ในศักยภาพตอนนี้ (${fmtTime(pot)}) — ทำได้ถ้าความทนทานพร้อม${race.km > 15 ? " เน้น Long Run" : ""}` });
  } else out.push({ lvl: "info", t: "ใส่ PB ในแท็บ “ฉัน” เพื่อให้แอปเช็กว่าเป้านี้เหมาะกับความฟิตตอนนี้ไหม" });
  const pb = (p.pbs || []).find(b => sameDist(+b.km, race.km));
  if (pb && race.target < +pb.time) {
    const imp = (+pb.time - race.target) / +pb.time;
    if (imp > 0.06) out.push({ lvl: "warn", t: `เร็วกว่า PB ${dl} เดิม (${fmtTime(pb.time)}) ถึง ${fmtTime(+pb.time - race.target)} (${Math.round(imp * 100)}%) — ความเร็วอาจพอ แต่ต้องสร้างความทนทานเพิ่มมาก${wk < rec ? " และเวลาเตรียมตัวค่อนข้างน้อย" : ""}` });
    else out.push({ lvl: "ok", t: `ทำลาย PB ${dl} เดิม ${fmtTime(+pb.time - race.target)} 💪` });
  }
  return out;
}
const checkHtml = list => list.map(x => `<div class="note ${x.lvl === "ok" ? "" : x.lvl}">${esc(x.t)}${x.suggest ? ` <button type="button" class="linkbtn" data-suggest="${x.suggest}">ใช้ ${fmtTime(x.suggest)}</button>` : ""}</div>`).join("");

function raceForm(id) {
  const p = P(), r = id ? p.races.find(x => x.id === id) : null;
  const known = r && DISTS.some(d => Math.abs(d.km - r.km) < 0.05);
  const defPrio = sortedRaces(p).some(x => x.date >= TODAY && prioOf(p, x) === "A") ? "B" : "A";   // ยังไม่มีงานหลัก → งานแรกเป็นงานหลัก
  openSheet(r ? "แก้ไขรายการแข่ง" : "เพิ่มรายการแข่ง", `<form id="rcForm">
    <label class="f">ชื่อรายการ<input name="name" value="${r ? esc(r.name) : ""}" placeholder="เช่น Bangkok Midnight Run" required></label>
    <label class="f">วันแข่ง<input type="date" name="date" value="${r ? r.date : ""}" required></label>
    <div class="flabel">ระยะ</div>
    <div class="seg">${DISTS.map(d => `<label><input type="radio" name="dist" value="${d.km}" ${r ? (Math.abs(d.km - r.km) < 0.05 ? "checked" : "") : (d.km === 10 ? "checked" : "")}><span>${d.label.replace("Half Marathon", "Half").replace("Marathon", "Full")}</span></label>`).join("")}<label><input type="radio" name="dist" value="other" ${r && !known ? "checked" : ""}><span>อื่น ๆ</span></label></div>
    <label class="f otherKm" ${r && !known ? "" : "hidden"}>ระยะ (กม.)<input name="km" inputmode="decimal" value="${r && !known ? r.km : ""}"></label>
    <div class="flabel">ความสำคัญ</div>
    <div class="seg">${Object.entries(PRIO).map(([k, v]) => `<label><input type="radio" name="prio" value="${k}" ${(r ? prioOf(p, r) : defPrio) === k ? "checked" : ""}><span>${v.icon} ${v.label.split(" /")[0]}</span></label>`).join("")}</div>
    <div class="hint prioHint" style="margin-top:-6px"></div>
    <div class="flabel">ตั้งเป้าเป็น</div>
    <div class="seg"><label><input type="radio" name="mode" value="pace" ${!r || r.mode !== "time" ? "checked" : ""}><span>เพซ (นาที/กม.)</span></label><label><input type="radio" name="mode" value="time" ${r && r.mode === "time" ? "checked" : ""}><span>เวลาจบ</span></label></div>
    <label class="f"><span class="tlabel">เพซเป้าหมาย</span><input name="target" inputmode="decimal" autocomplete="off" value="${r ? (r.mode === "time" ? fmtTime(r.target) : fmtPace(r.target / r.km)) : ""}" placeholder="5:00" required></label>
    <div class="hint"></div>
    <div class="checks" style="margin:-4px 0 14px"></div>
    <div class="btns"><button class="btn" type="submit">บันทึกและสร้างตาราง</button>${r ? `<button class="btn danger" type="button" data-act="delRace" data-id="${r.id}">ลบรายการนี้</button>` : ""}</div></form>`, body => {
    const form = body.querySelector("#rcForm"), F = form.elements;
    const km = () => F.dist.value === "other" ? parseFloat(F.km.value) || 0 : +F.dist.value;
    // exact = เวลาจบจริงที่ตั้งไว้ (กันค่าเพี้ยนจากการปัดเศษตอนสลับโหมด/แก้ไข)
    let exact = r ? r.target : 0, exactShown = r ? F.target.value : null;
    const targetT = () => {
      const d = km(); if (!d) return 0;
      if (exact && F.target.value === exactShown) return exact;
      return F.mode.value === "pace" ? Math.round(parsePace(F.target.value) * d) : parseDuration(F.target.value, d);
    };
    const upd = () => {
      body.querySelector(".otherKm").hidden = F.dist.value !== "other";
      const pace = F.mode.value === "pace";
      body.querySelector(".tlabel").textContent = pace ? "เพซเป้าหมาย (นาที:วินาที ต่อ กม.)" : "เวลาจบเป้าหมาย (ชม.:นาที:วินาที)";
      const d = km(), fit = fitness(p);
      F.target.placeholder = pace ? "5:00" : d > 15 ? "1:50:00" : "50:00";
      const T = targetT(), hint = body.querySelector(".hint");
      const bad = T && d && !PACE_OK(T / d);
      hint.style.color = bad ? "var(--bad)" : "";
      hint.textContent = !T || !d ? "" : bad ? `อ่านได้เป็น ${durTH(T)} (เพซ ${fmtPace(T / d)}/กม.) ดูไม่สมเหตุสมผล — ลองพิมพ์ เช่น ${pace ? "5:13" : d > 15 ? "1:50:00" : "50:00"}`
        : `= ${pace ? "เวลาจบ " + fmtTime(T) + " (" + durTH(T) + ")" : "เพซ " + fmtPace(T / d) + "/กม. (" + durTH(T) + ")"}` + (fit ? ` · ศักยภาพตอนนี้ ${fmtTime(vdotTime(fit.v, d))}` : "");
      body.querySelector(".prioHint").textContent = PRIO[F.prio.value].desc;
      const ch = T && d && !bad && F.date.value ? checkHtml(raceCheck(p, { km: d, target: T, date: F.date.value, prio: F.prio.value })) : "", box = body.querySelector(".checks");
      if (box.dataset.h !== ch) { box.innerHTML = ch; box.dataset.h = ch; }
    };
    body.querySelector(".checks").addEventListener("click", e => {
      const b = e.target.closest("[data-suggest]"); if (!b) return;
      const T = +b.dataset.suggest, d = km();
      F.target.value = F.mode.value === "pace" ? fmtPace(T / d) : fmtTime(T); exact = T; exactShown = F.target.value; upd();
    });
    let lastMode = F.mode.value;
    form.addEventListener("input", upd);
    form.addEventListener("change", e => {
      if (e.target.name === "mode" && F.mode.value !== lastMode) {
        F.mode.value = lastMode; const T = targetT(); F.mode.value = e.target.value;      // อ่านค่าด้วยโหมดเดิมก่อนแปลง
        const d = km(); if (T && d) { F.target.value = F.mode.value === "time" ? fmtTime(T) : fmtPace(T / d); exact = T; exactShown = F.target.value; }
        lastMode = F.mode.value;
      }
      if (e.target.name === "dist" || e.target.name === "km") { exact = 0; exactShown = null; }
      upd();
    });
    upd();
    form.addEventListener("submit", e => {
      e.preventDefault();
      const d = km(), T = targetT();
      if (!d) return toast("ใส่ระยะก่อนนะ"); if (!T) return toast("ใส่เป้าหมาย เช่น 5:00");
      if (!PACE_OK(T / d)) return toast("เป้าหมายดูไม่สมเหตุสมผล ตรวจรูปแบบเวลาอีกครั้ง");
      const data = { name: F.name.value.trim(), date: F.date.value, km: d, target: Math.round(T), mode: F.mode.value, prio: F.prio.value };
      // มีงานหลักได้หลายงาน แต่ถ้าตั้งงานนี้เป็นหลัก ให้งานอื่นที่ยังไม่ได้ตั้งค่าคงสถานะเดิมไว้
      p.races.forEach(x => { if (!x.prio && x !== r) x.prio = prioOf(p, x); });
      if (r) Object.assign(r, data); else p.races.push({ id: uid(), ...data });
      save(); closeSheet(); render(); toast("สร้างตารางใหม่แล้ว");
    });
  });
}

document.addEventListener("submit", e => {

    if (runDays.length < 2) return toast("เลือกวันวิ่งอย่างน้อย 2 วัน");
    let longDay = +F.longDay.value; if (!runDays.includes(longDay)) longDay = runDays[runDays.length - 1];
    Object.assign(p, { name: F.name.value.trim(), level: F.level.value, weeklyKm: parseFloat(F.weeklyKm.value) || 0, runDays, longDay,
      gymDays: [...e.target.querySelectorAll("input[name=gymDays]:checked")].map(x => +x.value), planStart: mondayOf(TODAY), startedOn: TODAY, onboarded: true });
    save(); render(); raceForm(); return;
  }
  if (e.target.id !== "meForm") return;
  e.preventDefault(); const F = e.target.elements, p = P();
  const runDays = [...e.target.querySelectorAll("input[name=runDays]:checked")].map(x => +x.value);
  if (runDays.length < 2) return toast("เลือกวันวิ่งอย่างน้อย 2 วัน");
  let longDay = +F.longDay.value; if (!runDays.includes(longDay)) longDay = runDays[runDays.length - 1];
  Object.assign(p, { name: F.name.value.trim() || "นักวิ่ง", sex: F.sex.value, birthYear: F.birthYear.value.trim(), weightKg: F.weightKg.value.trim(), level: F.level.value,
    weeklyKm: parseFloat(F.weeklyKm.value) || 0, runDays, longDay, gymDays: [...e.target.querySelectorAll("input[name=gymDays]:checked")].map(x => +x.value), planStart: F.planStart.value || mondayOf(TODAY) });
  save(); render(); toast("บันทึกแล้ว · สร้างตารางใหม่");
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => { const d = JSON.parse(t); if (!Array.isArray(d.profiles)) throw 0; DB = migrate(d); save(); render(); toast("นำเข้าข้อมูลแล้ว"); })
    .catch(() => toast("ไฟล์ไม่ถูกต้อง")); e.target.value = "";
});

// ---------- ติดตั้งแอป (PWA) ----------
let deferredPrompt = null;
const UA = navigator.userAgent;
const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isInApp = /Line\/|FBAN|FBAV|Instagram/i.test(UA);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const canInstall = () => !isStandalone() && (!!deferredPrompt || isIOS || isInApp);
function installDismissed() { try { return localStorage.getItem("kaowin.installHide") === "1"; } catch (e) { return false; } }
function installBanner() {
  if (!canInstall() || installDismissed()) return "";
  return `<div class="card install"><img src="${LOGO_ICON}" alt=""><div style="flex:1;min-width:0"><b>ติดตั้ง ${APP_NAME} ลงมือถือ</b><div class="tiny" style="color:#cfe9da">เปิดจากหน้าจอโฮม เต็มจอ ใช้ได้แม้ไม่มีเน็ต</div></div><button class="btn sm" data-act="install">ติดตั้ง</button><button class="x" data-act="installHide" aria-label="ซ่อน">×</button></div>`;
}
const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`;
function installGuide() {
  let body;
  if (isInApp) body = `<div class="note warn" style="margin-top:0">ตอนนี้เปิดอยู่ในแอป ${/Line\//i.test(UA) ? "LINE" : "โซเชียล"} ซึ่งติดตั้งไม่ได้</div>
    <ol class="steps"><li><div>กดปุ่ม <span class="kbd">⋯</span> หรือ <span class="kbd">⋮</span> มุมขวาบน</div></li>
    <li><div>เลือก <span class="kbd">${isIOS ? "เปิดใน Safari" : "เปิดในเบราว์เซอร์อื่น / Chrome"}</span></div></li>
    <li><div>แล้วกดปุ่ม <span class="kbd">ติดตั้ง</span> ในแอปอีกครั้ง</div></li></ol>`;
  else if (isIOS) body = `<ol class="steps">
    <li><div>กดปุ่มแชร์ <span class="kbd">${SHARE_ICON}</span> ${/CriOS|FxiOS/.test(UA) ? "ที่แถบที่อยู่ด้านบน" : "ที่แถบด้านล่างของ Safari"}</div></li>
    <li><div>เลื่อนลงแล้วเลือก <span class="kbd">＋ เพิ่มไปยังหน้าจอโฮม</span></div></li>
    <li><div>กด <span class="kbd">เพิ่ม</span> มุมขวาบน — ไอคอน ${APP_NAME} จะอยู่บนหน้าจอโฮม</div></li></ol>
    <div class="tiny mut">ถ้าไม่เจอเมนูนี้ ให้เปิดลิงก์ด้วย Safari ก่อน</div>`;
  else body = `<ol class="steps"><li><div>กดเมนู <span class="kbd">⋮</span> มุมขวาบนของ Chrome</div></li><li><div>เลือก <span class="kbd">ติดตั้งแอป</span> หรือ <span class="kbd">เพิ่มลงในหน้าจอหลัก</span></div></li></ol>`;
  openSheet(`ติดตั้ง ${APP_NAME}`, `<div style="text-align:center;margin-bottom:6px"><img src="${LOGO_ICON}" alt="" style="width:64px;height:64px"></div>${body}
    <div class="note info">ข้อมูลผลซ้อมเก็บในเครื่อง แอปที่ติดตั้งกับเบราว์เซอร์${isIOS ? "ใน iPhone แยกที่เก็บกัน — ถ้าเคยบันทึกในเบราว์เซอร์ไว้ ให้ Export แล้ว Import ในแอปที่ติดตั้ง" : "ใช้ข้อมูลชุดเดียวกัน"}</div>
    <div class="btns" style="margin-top:12px"><button class="btn" data-act="closeSheet">เข้าใจแล้ว</button></div>`);
}
async function doInstall() {
  if (deferredPrompt && !isInApp) {
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice.catch(() => ({}));
    deferredPrompt = null; render();
    if (r.outcome === "accepted") toast(`กำลังติดตั้ง ${APP_NAME}`);
  } else installGuide();
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; render(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; render(); toast(`ติดตั้ง ${APP_NAME} แล้ว 🎉`); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1"))
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

// โลโก้ + favicon
$("#wordmark").src = LOGO_WORDMARK;
(() => { const l = document.createElement("link"); l.rel = "icon"; l.type = "image/png"; l.href = LOGO_ICON; document.head.appendChild(l); })();

render();
</script>
</body>
</html>
